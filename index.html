<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouVsYou — Twój Tracker, Journal i Progres</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-base: #090b10;
      --bg-surface: rgba(17, 21, 32, 0.84);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --accent-1: #10b981;
      --accent-2: #6366f1;
      --accent-rgb: 16, 185, 129;
      --accent2-rgb: 99, 102, 241;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .ambient-bg {
      background:
        radial-gradient(circle at 12% 10%, rgba(var(--accent-rgb), 0.11), transparent 36%),
        radial-gradient(circle at 88% 16%, rgba(var(--accent2-rgb), 0.11), transparent 40%),
        var(--bg-base);
    }
    .glass-card {
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.55);
    }
    .accent-gradient { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); }
    .accent-bar { background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
    .accent-text { color: var(--accent-1); }
    .accent-badge {
      background-color: rgba(var(--accent-rgb), 0.15);
      border: 1px solid rgba(var(--accent-rgb), 0.34);
      color: var(--accent-1);
    }
    .accent-btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      box-shadow: 0 8px 24px -6px rgba(var(--accent-rgb), 0.45);
    }
    .accent-btn:hover { filter: brightness(1.08); }
    body.theme-light {
      --bg-base: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --border-subtle: rgba(15, 23, 42, 0.10);
      --text-main: #0f172a;
    }
    body.theme-light .text-white { color: #0f172a !important; }
    body.theme-light .text-slate-100,
    body.theme-light .text-slate-200,
    body.theme-light .text-slate-300 { color: #334155 !important; }
    body.theme-light .text-slate-400 { color: #64748b !important; }
    body.theme-light .bg-slate-900,
    body.theme-light .bg-slate-950 { background-color: #f8fafc !important; }
    body.theme-oled { --bg-base: #000000; --bg-surface: rgba(10, 12, 18, 0.94); }
  </style>
</head>
<body class="ambient-bg min-h-screen antialiased">
  <div id="app"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'youvsyou_tracker_v5';

      const ACCENT_THEMES = [
        { id: 'emerald_indigo', name: 'Szmaragd & Indygo', c1: '#10b981', c2: '#6366f1', rgb1: '16, 185, 129', rgb2: '99, 102, 241' },
        { id: 'cyan_cobalt', name: 'Cyjan & Kobalt', c1: '#06b6d4', c2: '#3b82f6', rgb1: '6, 182, 212', rgb2: '59, 130, 246' },
        { id: 'amber_copper', name: 'Bursztyn & Miedź', c1: '#f59e0b', c2: '#ea580c', rgb1: '245, 158, 11', rgb2: '234, 88, 12' },
        { id: 'crimson_violet', name: 'Karmazyn & Fiolet', c1: '#f43f5e', c2: '#8b5cf6', rgb1: '244, 63, 94', rgb2: '139, 92, 246' }
      ];

      const BG_MODES = [
        { id: 'dark', name: 'Ciemny Grafit' },
        { id: 'oled', name: 'Czerń OLED' },
        { id: 'light', name: 'Jasny Dzień' }
      ];

      const USER_AVATARS = [
        { id: 'cyber_fighter', name: 'Cyber Fighter', icon: '⚡' },
        { id: 'gentleman_stache', name: 'Wąsaty Dżentelmen', icon: '🧔' },
        { id: 'lifting_pro', name: 'Lifting Pro', icon: '🏋️' },
        { id: 'night_focus', name: 'Nocny Fokus', icon: '🎯' }
      ];

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
      function parseDateKey(key) {
        const parts = String(key).split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }
      function addDays(dateKey, delta) {
        const d = parseDateKey(dateKey);
        d.setDate(d.getDate() + delta);
        return toDateKey(d);
      }
      function daysBetween(startKey, endKey) {
        const a = parseDateKey(startKey);
        const b = parseDateKey(endKey);
        return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
      }
      function formatPolishDate(dateKey) {
        return parseDateKey(dateKey).toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }
      function formatShortDate(dateKey) {
        return parseDateKey(dateKey).toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
      }
      function parseWeightInput(val) {
        if (typeof val === 'number') return Number.isFinite(val) ? Number(val.toFixed(2)) : 0;
        const cleaned = String(val || '').trim().replace(',', '.').replace(/[^0-9.]/g, '');
        const num = parseFloat(cleaned);
        return Number.isFinite(num) ? Number(num.toFixed(2)) : 0;
      }
      function formatWeight(val) {
        return parseWeightInput(val).toFixed(2) + ' kg';
      }
      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, '&#39;');
      }

      const TODAY_KEY = toDateKey(new Date());

      function getDefaultData() {
        const startW = 82.00;
        const goalW = 78.00;
        const curMonth = TODAY_KEY.slice(0, 7);
        const d1 = addDays(TODAY_KEY, -6);
        const d2 = addDays(TODAY_KEY, -4);
        const d3 = addDays(TODAY_KEY, -2);

        return {
          onboardingCompleted: false,
          profile: {
            name: 'Zawodnik',
            gender: 'male',
            age: 22,
            heightCm: 180,
            startWeight: startW,
            currentWeight: startW,
            goalWeight: goalW,
            goalType: 'recomp',
            calorieGoal: 2450,
            proteinGoal: 175,
            carbsGoal: 265,
            fatGoal: 75,
            waterGoalMl: 3000,
            trainingWaterBonusMl: 500,
            userAvatar: 'cyber_fighter',
            accentTheme: 'emerald_indigo',
            bgMode: 'dark',
            focusAreas: ['mental', 'discipline', 'body'],
            enabledModules: {
              gym: true,
              calories: true,
              journal: true,
              sleep: true,
              water: true,
              weight: true,
              calendar: true
            }
          },
          habits: [
            { id: 'h_creatine', title: 'Kreatyna', icon: '⚡' },
            { id: 'h_water', title: 'Woda (cel dzienny)', icon: '💧' },
            { id: 'h_teeth_am', title: 'Mycie zębów rano', icon: '🪥' },
            { id: 'h_teeth_pm', title: 'Mycie zębów wieczorem', icon: '🌙' }
          ],
          habitCompletions: {},
          recurringRules: [
            { id: 'r_gym_3d', title: 'Siłownia', icon: '🏋️', type: 'every_n_days', intervalDays: 3, anchorDate: TODAY_KEY, isGymRule: true },
            { id: 'r_flowers', title: 'Kwiaty dla dziewczyny', icon: '💐', type: 'monthly_day', dayOfMonth: 14 }
          ],
          recurringCompletions: {},
          tasksByDate: {
            [TODAY_KEY]: [{ id: 't_1', title: 'Sprawdzić podsumowanie dnia w YouVsYou', done: false }]
          },
          events: [
            { id: 'e_1', title: 'Urodziny dziewczyny', date: curMonth + '-14', recurringYearly: true }
          ],
          caloriesByDate: {},
          sleepByDate: {
            [d1]: { hours: 7.5, quality: 'Dobry', energy: 4 },
            [d2]: { hours: 6.5, quality: 'Średni', energy: 3 },
            [d3]: { hours: 8.0, quality: 'Świetny', energy: 5 }
          },
          waterByDate: {},
          weightLogs: [
            { id: 'w_1', date: d3, weight: 82.60 },
            { id: 'w_2', date: d2, weight: 82.30 },
            { id: 'w_3', date: TODAY_KEY, weight: startW }
          ],
          workouts: [
            {
              id: 'wo_demo_1',
              date: addDays(TODAY_KEY, -3),
              title: 'Trening Siłowy A',
              exercises: [
                { name: 'Wyciskanie sztangi na ławce płaskiej', sets: [{ weight: 80, reps: 8 }, { weight: 82.5, reps: 7 }, { weight: 82.5, reps: 6 }] },
                { name: 'Wiosłowanie sztangą w opadzie', sets: [{ weight: 70, reps: 10 }, { weight: 75, reps: 8 }, { weight: 75, reps: 8 }] }
              ]
            }
          ],
          journalEntries: [
            {
              id: 'jr_demo_1',
              date: TODAY_KEY,
              time: '21:15',
              mood: 4,
              place: 'Dom',
              note: 'Spokojny wieczór, plan ułożony na jutro.'
            }
          ],
          aiMessages: [
            {
              role: 'assistant',
              text: 'Cześć! Wpisz co zrobiłeś, zjadłeś lub podniosłeś na treningu (np. "wypiłem 500 ml wody i wziąłem kreatynę" albo "Wyciskanie na ławce: 85kg x 8, 85kg x 7").',
              applied: []
            }
          ]
        };
      }

      function loadState() {
        const base = getDefaultData();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return base;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return base;
          return {
            ...base,
            ...parsed,
            profile: { ...base.profile, ...(parsed.profile || {}) },
            habits: Array.isArray(parsed.habits) && parsed.habits.length ? parsed.habits : base.habits,
            recurringRules: Array.isArray(parsed.recurringRules) && parsed.recurringRules.length ? parsed.recurringRules : base.recurringRules,
            events: Array.isArray(parsed.events) ? parsed.events : base.events,
            weightLogs: Array.isArray(parsed.weightLogs) && parsed.weightLogs.length ? parsed.weightLogs : base.weightLogs,
            workouts: Array.isArray(parsed.workouts) ? parsed.workouts : base.workouts,
            journalEntries: Array.isArray(parsed.journalEntries) ? parsed.journalEntries : base.journalEntries,
            aiMessages: Array.isArray(parsed.aiMessages) && parsed.aiMessages.length ? parsed.aiMessages : base.aiMessages
          };
        } catch (_) {
          return base;
        }
      }

      let state = loadState();
      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      const ui = {
        activeTab: 'today',
        selectedDate: TODAY_KEY,
        calMonthOffset: 0,
        aiOpen: false,
        aiDraft: '',
        onboardingStep: 0,
        showHabitEditor: false,
        showRuleModal: false,
        showSettingsModal: false,
        showEveningModal: false,
        tempProfile: { ...state.profile }
      };

      function applyTheme() {
        const th = ACCENT_THEMES.find(t => t.id === state.profile.accentTheme) || ACCENT_THEMES[0];
        const r = document.documentElement.style;
        r.setProperty('--accent-1', th.c1);
        r.setProperty('--accent-2', th.c2);
        r.setProperty('--accent-rgb', th.rgb1);
        r.setProperty('--accent2-rgb', th.rgb2);

        document.body.classList.remove('theme-light', 'theme-oled');
        if (state.profile.bgMode === 'light') {
          document.body.classList.add('theme-light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          if (state.profile.bgMode === 'oled') document.body.classList.add('theme-oled');
        }
      }

      function getRuleStatus(rule, dateKey) {
        if (rule.type === 'every_n_days') {
          const interval = Math.max(1, Number(rule.intervalDays) || 3);
          const diff = daysBetween(rule.anchorDate || TODAY_KEY, dateKey);
          const mod = ((diff % interval) + interval) % interval;
          const isDue = mod === 0;
          const daysUntil = isDue ? 0 : (interval - mod);
          return { isDue, daysUntil, label: isDue ? 'Dzisiaj wypada!' : (daysUntil === 1 ? 'Za 1 dzień' : 'Za ' + daysUntil + ' dni') };
        }
        const targetDay = Math.min(28, Math.max(1, Number(rule.dayOfMonth) || 14));
        const d = parseDateKey(dateKey);
        const curDay = d.getDate();
        const isDue = curDay === targetDay;
        let daysUntil = 0;
        if (!isDue) {
          if (curDay < targetDay) daysUntil = targetDay - curDay;
          else daysUntil = daysBetween(dateKey, toDateKey(new Date(d.getFullYear(), d.getMonth() + 1, targetDay)));
        }
        return { isDue, daysUntil, label: isDue ? 'Dzisiaj (' + targetDay + '. dzień miesiąca)' : targetDay + '. dnia miesiąca (za ' + daysUntil + ' dni)' };
      }

      function isTrainingDay(dateKey) {
        if ((state.workouts || []).some(w => w.date === dateKey)) return true;
        const gymRule = (state.recurringRules || []).find(r => r.isGymRule || r.title.toLowerCase().indexOf('siłown') !== -1);
        return Boolean(gymRule && getRuleStatus(gymRule, dateKey).isDue);
      }

      function getEffectiveWaterGoal(dateKey) {
        const base = Number(state.profile.waterGoalMl) || 3000;
        const bonus = Number(state.profile.trainingWaterBonusMl) || 500;
        return isTrainingDay(dateKey) ? base + bonus : base;
      }

      function getWaterTotal(dateKey) {
        return (state.waterByDate[dateKey] || []).reduce((sum, item) => sum + (Number(item.ml) || 0), 0);
      }

      function addWater(dateKey, ml, source) {
        const amount = Math.round(Number(ml) || 0);
        if (amount <= 0) return;
        if (!state.waterByDate[dateKey]) state.waterByDate[dateKey] = [];
        const now = new Date();
        state.waterByDate[dateKey].push({
          id: 'wtr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          ml: amount,
          time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
          source: source || 'Wpis'
        });
        const waterHabit = state.habits.find(h => h.id === 'h_water' || h.title.toLowerCase().indexOf('woda') !== -1);
        if (waterHabit && getWaterTotal(dateKey) >= getEffectiveWaterGoal(dateKey)) {
          if (!state.habitCompletions[dateKey]) state.habitCompletions[dateKey] = {};
          state.habitCompletions[dateKey][waterHabit.id] = true;
        }
        saveState();
      }

      function getCaloriesSummary(dateKey) {
        return (state.caloriesByDate[dateKey] || []).reduce((acc, it) => {
          acc.kcal += Number(it.kcal) || 0;
          acc.protein += Number(it.protein) || 0;
          acc.carbs += Number(it.carbs) || 0;
          acc.fat += Number(it.fat) || 0;
          return acc;
        }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
      }

      function addMeal(dateKey, name, kcal, protein, carbs, fat) {
        if (!state.caloriesByDate[dateKey]) state.caloriesByDate[dateKey] = [];
        state.caloriesByDate[dateKey].push({
          id: 'meal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name: (name || 'Posiłek').trim(),
          kcal: Math.max(0, Math.round(Number(kcal) || 0)),
          protein: Math.max(0, Math.round(Number(protein) || 0)),
          carbs: Math.max(0, Math.round(Number(carbs) || 0)),
          fat: Math.max(0, Math.round(Number(fat) || 0))
        });
        saveState();
      }

      function addWeight(dateKey, weightVal) {
        const w = parseWeightInput(weightVal);
        if (w <= 0) return;
        state.profile.currentWeight = w;
        if (!state.profile.startWeight || state.profile.startWeight <= 0) state.profile.startWeight = w;
        const idx = state.weightLogs.findIndex(x => x.date === dateKey);
        if (idx >= 0) state.weightLogs[idx].weight = w;
        else state.weightLogs.push({ id: 'w_' + Date.now(), date: dateKey, weight: w });
        state.weightLogs.sort((a, b) => a.date.localeCompare(b.date));
        saveState();
      }

      function calculateTargets(profile) {
        const weight = parseWeightInput(profile.currentWeight) || 80;
        const height = Number(profile.heightCm) || 180;
        const age = Number(profile.age) || 22;
        const bmr = Math.round(10 * weight + 6.25 * height - 5 * age + (profile.gender === 'female' ? -161 : 5));
        const tdee = Math.round(bmr * 1.5);
        let calorieGoal = tdee;
        if (profile.goalType === 'cut') calorieGoal = tdee - 350;
        if (profile.goalType === 'bulk') calorieGoal = tdee + 300;
        calorieGoal = Math.max(1400, Math.round(calorieGoal / 25) * 25);
        const proteinGoal = Math.round(weight * (profile.goalType === 'cut' ? 2.1 : 1.9));
        const fatGoal = Math.round(weight * 0.85);
        const carbsGoal = Math.round(Math.max(200, calorieGoal - (proteinGoal * 4 + fatGoal * 9)) / 4);
        const waterGoalMl = Math.max(2000, Math.round((weight * 35) / 250) * 250);
        return { bmr, tdee, calorieGoal, proteinGoal, carbsGoal, fatGoal, waterGoalMl };
      }

      function estimate1RM(weight, reps) {
        const w = Number(weight) || 0;
        const r = Number(reps) || 0;
        if (w <= 0 || r <= 0) return 0;
        return r === 1 ? Number(w.toFixed(1)) : Number((w * (1 + r / 30)).toFixed(1));
      }

      function parseWorkoutText(rawText) {
        const lines = String(rawText || '').split(/\n|;/).map(l => l.trim()).filter(Boolean);
        const exercises = [];

        for (const line of lines) {
          const clean = line.replace(/^(trening|siłownia|silownia)\s*[:\-]\s*/i, '').trim();
          const colonIdx = clean.indexOf(':');
          if (colonIdx === -1) continue;
          const exName = clean.slice(0, colonIdx).trim();
          const setsStr = clean.slice(colonIdx + 1).trim();
          if (!exName || !setsStr) continue;

          const sets = [];
          const parts = setsStr.split(',');
          for (const part of parts) {
            const m = part.trim().match(/(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[x×*]\s*(\d+)/i);
            if (m) {
              sets.push({
                weight: parseFloat(m[1].replace(',', '.')),
                reps: Number(m[2])
              });
            }
          }
          if (sets.length) exercises.push({ name: exName, sets });
        }
        return exercises;
      }

      function getExerciseAnalytics() {
        const sorted = [...(state.workouts || [])].sort((a, b) => a.date.localeCompare(b.date));
        const map = {};

        for (const wo of sorted) {
          for (const ex of (wo.exercises || [])) {
            const key = String(ex.name || '').trim().toLowerCase();
            if (!key) continue;
            if (!map[key]) {
              map[key] = { name: ex.name.trim(), bestWeight: 0, bestWeightReps: 0, bestWeightDate: '', best1RM: 0, best1RMDate: '', sessions: [] };
            }
            const item = map[key];
            let sMaxW = 0, sMaxR = 0, sBest1RM = 0;
            for (const s of (ex.sets || [])) {
              const w = Number(s.weight) || 0;
              const r = Number(s.reps) || 0;
              const e1 = estimate1RM(w, r);
              if (e1 > sBest1RM) sBest1RM = e1;
              if (w > sMaxW || (w === sMaxW && r > sMaxR)) { sMaxW = w; sMaxR = r; }
            }
            if (sBest1RM > item.best1RM) { item.best1RM = sBest1RM; item.best1RMDate = wo.date; }
            if (sMaxW > item.bestWeight || (sMaxW === item.bestWeight && sMaxR > item.bestWeightReps)) {
              item.bestWeight = sMaxW;
              item.bestWeightReps = sMaxR;
              item.bestWeightDate = wo.date;
            }
            item.sessions.push({ date: wo.date, sets: ex.sets || [], best1RM: sBest1RM });
          }
        }

        const lastSleep = state.sleepByDate[TODAY_KEY] || state.sleepByDate[addDays(TODAY_KEY, -1)];
        const lowRec = lastSleep && (Number(lastSleep.hours) < 6.2 || Number(lastSleep.energy) <= 2);

        return Object.values(map).map(entry => {
          const last = entry.sessions[entry.sessions.length - 1];
          const topSet = last.sets.reduce((b, c) => (Number(c.weight) >= Number(b.weight) ? c : b), last.sets[0]);
          const minReps = Math.min(...last.sets.map(s => Number(s.reps) || 0));
          const maxReps = Math.max(...last.sets.map(s => Number(s.reps) || 0));
          const step = Number(topSet.weight) >= 40 ? 2.5 : 1.25;
          let nextPlan = '';
          if (lowRec) {
            nextPlan = 'Słabsza regeneracja (sen/energia): utrzymaj ' + topSet.weight + ' kg × ' + minReps + '–' + maxReps + ' powt.';
          } else if (minReps >= 8) {
            nextPlan = 'Progresja ciężaru: wejdź na ' + (Number(topSet.weight) + step).toFixed(2).replace(/\.00$/, '') + ' kg (3 × 6–8 powt.).';
          } else {
            nextPlan = 'Podwójna progresja: zostaw ' + topSet.weight + ' kg i celuj w ' + Math.min(10, maxReps + 1) + ' powt.';
          }
          return {
            ...entry,
            isRecentPR: entry.best1RMDate && daysBetween(entry.best1RMDate, TODAY_KEY) <= 4,
            nextPlan
          };
        });
      }

      function processAiInput(raw) {
        const text = String(raw || '').trim();
        if (!text) return;
        state.aiMessages.push({ role: 'user', text: text, applied: [] });
        ui.aiDraft = '';

        const lower = text.toLowerCase();
        const applied = [];
        let targetDate = TODAY_KEY;
        if (lower.indexOf('jutro') !== -1) targetDate = addDays(TODAY_KEY, 1);
        else if (lower.indexOf('wczoraj') !== -1) targetDate = addDays(TODAY_KEY, -1);

        const exs = parseWorkoutText(text);
        if (exs.length) {
          state.workouts.push({ id: 'wo_' + Date.now(), date: targetDate, title: 'Trening siłowy', exercises: exs });
          applied.push('Zapisano trening: ' + exs.map(e => e.name).join(', '));
          state.aiMessages.push({ role: 'assistant', text: 'Zapisałem trening i zaktualizowałem rekordy w zakładce Siłownia & Progres!', applied });
          saveState();
          render();
          return;
        }

        const segments = text
          .split(/(?:\s+i\s+|\s+oraz\s+(?:że\s+)?|,\s*|\s+że\s+)/i)
          .map(s => s.trim())
          .filter(Boolean);

        for (const seg of segments) {
          const sLow = seg.toLowerCase();
          let segDate = targetDate;
          if (sLow.indexOf('jutro') !== -1) segDate = addDays(TODAY_KEY, 1);
          else if (sLow.indexOf('wczoraj') !== -1) segDate = addDays(TODAY_KEY, -1);

          const sMl = sLow.match(/(\d{2,4})\s*ml/);
          const sL = sLow.match(/(\d+(?:[.,]\d+)?)\s*(?:l|litr)/);
          if (sMl) {
            addWater(segDate, Number(sMl[1]), 'Asystent AI');
            applied.push('+' + sMl[1] + ' ml wody (' + formatShortDate(segDate) + ')');
            continue;
          }
          if (sL) {
            const mlVal = Math.round(parseFloat(sL[1].replace(',', '.')) * 1000);
            addWater(segDate, mlVal, 'Asystent AI');
            applied.push('+' + mlVal + ' ml wody (' + formatShortDate(segDate) + ')');
            continue;
          }

          const sW = sLow.match(/(?:waż[ęe]|waze|waga)\s*(\d{2,3}(?:[.,]\d{1,2})?)/);
          if (sW) {
            const wVal = parseWeightInput(sW[1]);
            addWeight(segDate, wVal);
            applied.push('Waga: ' + formatWeight(wVal));
            continue;
          }

          const sSl = sLow.match(/(\d+(?:[.,]\d+)?)\s*(?:h|godz)/);
          if (sSl) {
            const hVal = parseFloat(sSl[1].replace(',', '.'));
            state.sleepByDate[segDate] = { hours: hVal, quality: 'Dobry', energy: 4 };
            applied.push('Sen: ' + hVal + 'h');
            continue;
          }

          const sKcal = sLow.match(/(\d{2,4})\s*kcal/);
          if (sKcal || sLow.indexOf('zjad') !== -1 || sLow.indexOf('ryż') !== -1 || sLow.indexOf('ryz') !== -1 || sLow.indexOf('kurczak') !== -1) {
            const pM = sLow.match(/(\d{1,3})\s*g?\s*białk/);
            const cM = sLow.match(/(\d{1,3})\s*g?\s*węgl/);
            const fM = sLow.match(/(\d{1,3})\s*g?\s*tłuszcz/);
            const kcalVal = sKcal ? Number(sKcal[1]) : 550;
            const protVal = pM ? Number(pM[1]) : 42;
            const carbVal = cM ? Number(cM[1]) : 65;
            const fatVal = fM ? Number(fM[1]) : 10;
            const cleanMeal = seg.replace(/^(dzisiaj|wczoraj|jutro|i|oraz|zjadłem|zjadlem|zjadłam|zjadlam)\s+/i, '').trim() || 'Posiłek';
            addMeal(segDate, cleanMeal.slice(0, 45), kcalVal, protVal, carbVal, fatVal);
            applied.push('Posiłek (' + formatShortDate(segDate) + '): ' + kcalVal + ' kcal');
            continue;
          }

          if (sLow.indexOf('kreatyn') !== -1) {
            if (!state.habitCompletions[segDate]) state.habitCompletions[segDate] = {};
            state.habitCompletions[segDate]['h_creatine'] = true;
            applied.push('Zaliczono nawyk: Kreatyna');
            continue;
          }

          const cleanTask = seg
            .replace(/^(dzisiaj|wczoraj|jutro|muszę|musze|trzeba|zrobić|zrobic|kupić|kupic|że|i|oraz)\s+/gi, '')
            .replace(/^(muszę|musze)\s+/i, '')
            .trim();
          const finalTask = (/^(kup|zrób|zrob|weź|wez|idź|idz|sprawdź|sprawdz)/i.test(cleanTask) ? cleanTask : (sLow.indexOf('kup') !== -1 ? 'Kupić ' + cleanTask : cleanTask));
          if (finalTask) {
            if (!state.tasksByDate[segDate]) state.tasksByDate[segDate] = [];
            state.tasksByDate[segDate].push({ id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), title: finalTask.charAt(0).toUpperCase() + finalTask.slice(1), done: false });
            applied.push('Zadanie (' + formatShortDate(segDate) + '): ' + finalTask.charAt(0).toUpperCase() + finalTask.slice(1));
          }
        }

        state.aiMessages.push({ role: 'assistant', text: 'Gotowe — zaktualizowałem Twój planer YouVsYou!', applied });
        saveState();
        render();
      }

      function buildPersonalizedPlan(gender, goalType, focusAreas) {
        const isFemale = gender === 'female';
        const foci = Array.isArray(focusAreas) && focusAreas.length ? focusAreas : ['mental', 'discipline'];
        const hasDiscipline = foci.indexOf('discipline') !== -1;
        const hasMental = foci.indexOf('mental') !== -1;
        const hasBody = foci.indexOf('body') !== -1;

        const habits = [
          { id: 'h_water', title: 'Woda (cel dzienny)', icon: '💧' }
        ];
        const starterTasks = [];
        const suggestedRules = [];

        if (hasMental) {
          habits.push({ id: 'h_evening_prayer', title: 'Modlitwa / wyciszenie wieczorem', icon: '🕊️' });
          habits.push({ id: 'h_mental_checkin', title: 'Wpis w Journalu i ocena samopoczucia', icon: '🧠' });
          starterTasks.push({ id: 't_mental_1', title: 'Wieczorna modlitwa lub 5 min ciszy i zapisanie samopoczucia', done: false });
        }

        if (hasDiscipline) {
          habits.push({ id: 'h_creatine', title: 'Kreatyna codziennie', icon: '⚡' });
          habits.push({ id: 'h_rhythm', title: 'Trzymać ustalony plan dnia', icon: '🎯' });
          if (hasBody) {
            suggestedRules.push({
              id: 'r_gym_2d',
              title: 'Siłownia',
              icon: '🏋️',
              type: 'every_n_days',
              intervalDays: 2,
              anchorDate: TODAY_KEY,
              isGymRule: true
            });
            starterTasks.push({ id: 't_disc_1', title: 'Zrealizować zaplanowany trening na siłowni', done: false });
          } else {
            starterTasks.push({ id: 't_disc_1', title: 'Domknąć 3 najważniejsze zadania dnia bez odkładania', done: false });
          }
        }

        if (hasBody) {
          if (goalType === 'cut') {
            habits.push({ id: 'h_steps', title: isFemale ? 'Spacer / 8 000 kroków' : 'Spacer / 10 000 kroków', icon: '🚶' });
            habits.push({ id: 'h_protein_goal', title: 'Domknąć białko w diecie', icon: '🥗' });
            starterTasks.push({ id: 't_cut_1', title: 'Dopilnować posiłków pod deficyt kaloryczny', done: false });
          } else if (goalType === 'bulk') {
            if (!hasDiscipline) habits.push({ id: 'h_creatine', title: 'Kreatyna codziennie', icon: '⚡' });
            habits.push({ id: 'h_surplus_meals', title: 'Zjeść pełne posiłki (nadwyżka)', icon: '🍚' });
            starterTasks.push({ id: 't_bulk_1', title: 'Przygotować posiłek potreningowy', done: false });
          } else {
            if (!hasDiscipline) habits.push({ id: 'h_creatine', title: 'Kreatyna codziennie', icon: '⚡' });
            habits.push({ id: 'h_mobility', title: isFemale ? 'Rozciąganie / mobilność' : 'Rozgrzewka i mobilność', icon: '🧘' });
            starterTasks.push({ id: 't_recomp_1', title: 'Zaplanować treningi i posiłki na ten tydzień', done: false });
          }
        }

        if (isFemale && hasMental) {
          habits.push({ id: 'h_skincare', title: 'Wieczorna rutyna i odpoczynek', icon: '✨' });
        }

        const enabledModules = {
          gym: hasBody,
          calories: hasBody,
          journal: hasMental || !hasBody,
          sleep: true,
          water: true,
          weight: hasBody,
          calendar: true
        };

        const focusLabels = [];
        if (hasMental) focusLabels.push('Mental i spokój');
        if (hasDiscipline) focusLabels.push('Samodyscyplina');
        if (hasBody) focusLabels.push('Sylwetka i forma');

        return {
          habits,
          starterTasks,
          suggestedRules,
          enabledModules,
          focusSummary: focusLabels.join(' • '),
          greeting: 'Twój panel został dopasowany pod: ' + focusLabels.join(', ') + '.'
        };
      }

            { id: 'discipline', title: '⚡ Samodyscyplina i konsekwencja', desc: 'Codzienna rutyna, kreatyna, konsekwencja w zadaniach i cykliczne nawyki.' },

        } else if (stepObj.id === 'modules') {

            { key: 'water', label: '💧 Nawodnienie (Woda)' }
          ];
          body = '<h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Dopasuj widoczne moduły</h1><p class="text-xs text-slate-400 mb-4">Zostaw tylko to, z czego realnie chcesz korzystać (później zmienisz to w ustawieniach).</p><div class="space-y-2">' + modList.map(m => {
            const on = Boolean(p.enabledModules[m.key]);
            return '<button type="button" data-ob-mod="' + m.key + '" class="w-full p-3.5 rounded-xl border text-left text-xs font-bold flex items-center justify-between ' + (on ? 'accent-badge' : 'bg-slate-900 border-white/10 text-slate-400') + '">' +
              '<span>' + m.label + '</span><span>' + (on ? 'WŁĄCZONE ✓' : 'UKRYTE') + '</span>' +
            '</button>';

        } else if (stepObj.id === 'body_stats') {
          body = '<h1 class="text-3xl font-extrabold text-white mb-6">Wiek i wzrost</h1><div class="grid grid-cols-2 gap-4"><div><label class="block text-xs text-slate-400 mb-1">Wiek (lat)</label><input id="ob-age" type="number" value="' + p.age + '" class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-white/15 text-xl font-bold text-white" /></div><div><label class="block text-xs text-slate-400 mb-1">Wzrost (cm)</label><input id="ob-height" type="number" value="' + p.heightCm + '" class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-white/15 text-xl font-bold text-white" /></div></div>';

        } else if (stepObj.id === 'goal') {
          const opts = [
            { id: 'cut', label: '🔥 Redukcja / Spadek wagi' },

            { id: 'bulk', label: '💪 Masa mięśniowa' }
          ];
          body = '<h1 class="text-3xl font-extrabold text-white mb-6">Twój główny cel sylwetkowy</h1><div class="space-y-3">' + opts.map(o => '<button type="button" data-ob-goal="' + o.id + '" class="w-full p-4 rounded-2xl border text-left font-bold ' + (p.goalType === o.id ? 'accent-badge' : 'bg-slate-900 border-white/10 text-slate-300') + '">' + o.label + '</button>').join('') + '</div>';
        } else {
          body = '<h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Gotowy zestaw na start</h1><p class="text-xs text-slate-400 mb-4">' + escapeHtml(planPreview.greeting) + '</p>' +
            (hasBody ? '<div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-xs text-slate-400 mb-1">Kalorie (kcal)</label><input id="ob-kcal" type="number" value="' + calc.calorieGoal + '" class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-white/15 text-xl font-bold accent-text" /></div><div><label class="block text-xs text-slate-400 mb-1">Woda bazowa (ml)</label><input id="ob-water" type="number" value="' + calc.waterGoalMl + '" class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-white/15 text-xl font-bold text-cyan-300" /></div></div>' : '<div class="mb-4"><label class="block text-xs text-slate-400 mb-1">Dzienny cel wody (ml)</label><input id="ob-water" type="number" value="' + (p.waterGoalMl || 2500) + '" class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-white/15 text-xl font-bold text-cyan-300" /></div>') +
            '<div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 text-xs text-slate-300 space-y-2">' +
              '<div><div class="font-bold text-white mb-1">Proponowane nawyki:</div>' + planPreview.habits.map(h => '<div>' + h.icon + ' ' + escapeHtml(h.title) + '</div>').join('') + '</div>' +
              '<div><div class="font-bold text-white mb-1">Proponowane zadania na dziś:</div>' + planPreview.starterTasks.map(t => '<div>• ' + escapeHtml(t.title) + '</div>').join('') + '</div>' +
            '</div>';
        }

        document.getElementById('app').innerHTML =
          '<div class="min-h-screen flex flex-col justify-between px-4 py-6 max-w-xl mx-auto">' +
            '<div><div class="flex justify-between items-center mb-3"><span class="font-extrabold text-white">YouVsYou • Krok ' + (ui.onboardingStep + 1) + '/' + total + '</span><button id="ob-skip" class="text-xs text-slate-400 hover:text-white">Pomiń →</button></div><div class="w-full h-2 rounded-full bg-white/10"><div class="h-full accent-bar rounded-full" style="width:' + pct + '%"></div></div></div>' +
            '<div class="glass-card rounded-3xl p-6 sm:p-8 my-6">' + body + '</div>' +
            '<div class="flex justify-between"><button id="ob-prev" ' + (ui.onboardingStep === 0 ? 'disabled' : '') + ' class="px-5 py-3 rounded-xl border border-white/10 text-sm text-slate-300 disabled:opacity-30">← Wstecz</button><button id="ob-next" class="px-7 py-3 rounded-xl accent-btn font-bold text-sm">' + (ui.onboardingStep === total - 1 ? 'Uruchom YouVsYou ✓' : 'Dalej →') + '</button></div>' +
          '</div>';

        const sync = () => {
          if (stepObj.id === 'name') p.name = document.getElementById('ob-input')?.value || p.name;
          if (stepObj.id === 'body_stats') {
            p.age = Number(document.getElementById('ob-age')?.value) || 22;
            p.heightCm = Number(document.getElementById('ob-height')?.value) || 180;
          }
          if (stepObj.id === 'weights') {
            p.startWeight = parseWeightInput(document.getElementById('ob-sw')?.value);
            p.goalWeight = parseWeightInput(document.getElementById('ob-gw')?.value);
          }
          if (stepObj.id === 'summary') {
            if (document.getElementById('ob-kcal')) p.calorieGoal = Number(document.getElementById('ob-kcal').value) || calc.calorieGoal;
            if (document.getElementById('ob-water')) p.waterGoalMl = Number(document.getElementById('ob-water').value) || calc.waterGoalMl;
          }
        };

        const finish = () => {
          sync();
          const sw = parseWeightInput(p.startWeight) || (p.gender === 'female' ? 62.00 : 82.00);
          const gw = parseWeightInput(p.goalWeight) || sw;
          const gen = p.gender === 'female' ? 'female' : 'male';
          const goal = p.goalType || 'recomp';
          const foci = Array.isArray(p.focusAreas) && p.focusAreas.length ? p.focusAreas : ['mental', 'discipline'];
          const c = calculateTargets({ ...p, gender: gen, goalType: goal, currentWeight: sw });
          const plan = buildPersonalizedPlan(gen, goal, foci);
          const mods = p.enabledModules || plan.enabledModules;

          state.profile = {
            ...state.profile,
            name: (p.name || (gen === 'female' ? 'Zawodniczka' : 'Zawodnik')).trim(),
            gender: gen,
            focusAreas: foci,
            enabledModules: mods,
            age: p.age,
            heightCm: p.heightCm,
            startWeight: sw,
            currentWeight: sw,
            goalWeight: gw,
            goalType: goal,
            calorieGoal: p.calorieGoal || c.calorieGoal,
            proteinGoal: c.proteinGoal,
            carbsGoal: c.carbsGoal,
            fatGoal: c.fatGoal,
            waterGoalMl: p.waterGoalMl || c.waterGoalMl
          };
          state.habits = plan.habits;
          state.tasksByDate[TODAY_KEY] = plan.starterTasks;
          const nonGym = (state.recurringRules || []).filter(r => !r.isGymRule && r.id !== 'r_gym_3d' && r.id !== 'r_gym_2d');
          state.recurringRules = [...(plan.suggestedRules || []), ...nonGym];
          if (mods.weight) addWeight(TODAY_KEY, sw);
          state.onboardingCompleted = true;
          saveState();
          render();
        };

        document.getElementById('ob-prev')?.addEventListener('click', () => { sync(); if (ui.onboardingStep > 0) { ui.onboardingStep--; render(); } });
        document.getElementById('ob-next')?.addEventListener('click', () => { sync(); if (ui.onboardingStep < total - 1) { ui.onboardingStep++; render(); } else finish(); });
        document.getElementById('ob-skip')?.addEventListener('click', finish);
        document.querySelectorAll('[data-ob-gender]').forEach(b => b.addEventListener('click', () => { p.gender = b.getAttribute('data-ob-gender'); ui.onboardingStep++; render(); }));
        document.querySelectorAll('[data-ob-focus]').forEach(b => b.addEventListener('click', () => {
          const fId = b.getAttribute('data-ob-focus');
          const cur = Array.isArray(p.focusAreas) ? [...p.focusAreas] : ['mental'];
          const idx = cur.indexOf(fId);
          if (idx >= 0) {
            if (cur.length > 1) cur.splice(idx, 1);
          } else {
            cur.push(fId);
          }
          p.focusAreas = cur;
          const nextPlan = buildPersonalizedPlan(p.gender || 'male', p.goalType || 'recomp', cur);
          p.enabledModules = { ...nextPlan.enabledModules };
          render();
        }));
        document.querySelectorAll('[data-ob-mod]').forEach(b => b.addEventListener('click', () => {
          const k = b.getAttribute('data-ob-mod');
          p.enabledModules[k] = !p.enabledModules[k];

          render();
        }));
        document.getElementById('btn-save-sleep')?.addEventListener('click', () => {
          state.sleepByDate[TODAY_KEY] = {
            hours: Number(document.getElementById('sleep-h')?.value) || 7.5,
            quality: 'Dobry',
            energy: Number(document.getElementById('sleep-e')?.value) || 4
          };
          saveState();
          render();
        });
        document.querySelectorAll('[data-add-w]').forEach(b => b.addEventListener('click', () => {
          addWater(TODAY_KEY, Number(b.getAttribute('data-add-w')), 'Przycisk');
          render();
        }));
        document.getElementById('btn-save-w')?.addEventListener('click', () => {
          addWeight(TODAY_KEY, document.getElementById('w-val')?.value);
          render();
        });
        document.getElementById('btn-open-set')?.addEventListener('click', () => { ui.showSettingsModal = true; render(); });
        document.getElementById('btn-close-set')?.addEventListener('click', () => { ui.showSettingsModal = false; render(); });
        document.querySelectorAll('[data-accent]').forEach(b => b.addEventListener('click', () => { state.profile.accentTheme = b.getAttribute('data-accent'); saveState(); render(); }));
        document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => { state.profile.bgMode = b.getAttribute('data-bg'); saveState(); render(); }));
        document.querySelectorAll('[data-av]').forEach(b => b.addEventListener('click', () => { state.profile.userAvatar = b.getAttribute('data-av'); saveState(); render(); }));
        document.querySelectorAll('[data-tog-mod]').forEach(b => b.addEventListener('click', () => {
          const k = b.getAttribute('data-tog-mod');
          if (!state.profile.enabledModules) state.profile.enabledModules = { gym: true, calories: true, journal: true, sleep: true, water: true, weight: true, calendar: true };
          state.profile.enabledModules[k] = state.profile.enabledModules[k] === false ? true : false;
          saveState();
          render();
        }));
        document.getElementById('btn-add-jr')?.addEventListener('click', () => {
          const note = (document.getElementById('jr-note')?.value || '').trim();
          const place = (document.getElementById('jr-place')?.value || '').trim() || 'Dom';
          const mood = Number(document.getElementById('jr-mood')?.value) || 4;
          if (!note) return;
          if (!state.journalEntries) state.journalEntries = [];
          const now = new Date();
          state.journalEntries.push({
            id: 'jr_' + Date.now(),
            date: dKey,
            time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
            mood,
            place,
            note
          });
          saveState();
          render();
        });
        document.querySelectorAll('[data-del-jr]').forEach(b => b.addEventListener('click', () => {
          state.journalEntries = (state.journalEntries || []).filter(e => e.id !== b.getAttribute('data-del-jr'));
          saveState();
          render();
        }));
        document.getElementById('btn-reopen-ob')?.addEventListener('click', () => { ui.showSettingsModal = false; ui.onboardingStep = 0; ui.tempProfile = { ...state.profile }; state.onboardingCompleted = false; saveState(); render(); });
        document.getElementById('btn-evening')?.addEventListener('click', () => { ui.showEveningModal = true; render(); });
        document.getElementById('btn-close-ev')?.addEventListener('click', () => { ui.showEveningModal = false; render(); });
        document.getElementById('btn-open-ai')?.addEventListener('click', () => { ui.aiOpen = true; render(); });
        document.getElementById('btn-close-ai')?.addEventListener('click', () => { ui.aiOpen = false; render(); });
        document.getElementById('btn-ai-send')?.addEventListener('click', () => processAiInput(document.getElementById('ai-inp')?.value));
        document.getElementById('ai-inp')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); processAiInput(e.target.value); } });
      }

      window.render = render;
      render();
    })();
  </script>
</body>
</html>
