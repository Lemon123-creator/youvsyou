    function toDateKey(dateObj) {

            type: 'every_n_days',
            intervalDays: 3,
            anchorDate: TODAY_KEY
          },

            id: 'r_flowers_monthly',
            title: 'Kwiaty dla dziewczyny',
            icon: '💐',
            type: 'monthly_day',
            dayOfMonth: 14
          }

        tasksByDate: {
          [TODAY_KEY]: [

        events: [
          { id: 'e_1', title: 'Urodziny dziewczyny', date: `${currentMonth}-14`, recurringYearly: true, category: 'Bliscy' } ], caloriesByDate: { [TODAY_KEY]: [] }, sleepByDate: { [d1]: { hours: 7.5, quality: 'Dobry', note: '' }, [d2]: { hours: 6.5, quality: 'Średni', note: '' }, [d3]: { hours: 8.0, quality: 'Świetny', note: '' } }, waterByDate: { [TODAY_KEY]: [] }, weightLogs: [ { id: 'w_1', date: d3, weight: Number((startWeight + 0.6).toFixed(2)) }, { id: 'w_2', date: d2, weight: Number((startWeight + 0.3).toFixed(2)) }, { id: 'w_3', date: TODAY_KEY, weight: startWeight } ], aiMessages: [ { role: 'assistant', text: 'Cześć! Jestem Twoim asystentem w **YouVsYou**. Napisz naturalnie co zrobiłeś, zjadłeś, wypiłeś albo zaplanowałeś — np. *"wypiłem 500 ml wody i wziąłem kreatynę"*, *"ważę dziś 81.50 kg"* albo *"dodaj nawyk rozciąganie wieczorem"*.', applied: [] } ] }; }  function readBackupFromWindow() { try { if (window.name && window.name.startsWith(BACKUP_NAME_KEY)) { const raw = window.name.slice(BACKUP_NAME_KEY.length); const parsed = JSON.parse(raw); if (parsed && typeof parsed === 'object') return parsed; } } catch (_) {} return null; }  function writeBackupToWindow(data) { try { const serialized = JSON.stringify(data); if (serialized.length < 1500000) { window.name = BACKUP_NAME_KEY + serialized; } } catch (_) {} }  let memoryFallbackState = null;  function loadState() { const base = getDefaultData(); let parsed = null; try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) parsed = JSON.parse(raw); } catch (_) {}  const winBackup = readBackupFromWindow(); if (!parsed && winBackup) parsed = winBackup; if (!parsed && memoryFallbackState) parsed = memoryFallbackState;  if (!parsed \vert{}\vert{} typeof parsed !== 'object') return base;  const mergedProfile = { ...base.profile, ...(parsed.profile \vert{}\vert{} {}) }; mergedProfile.startWeight = parseWeightInput(mergedProfile.startWeight ?? base.profile.startWeight); mergedProfile.currentWeight = parseWeightInput(mergedProfile.currentWeight ?? mergedProfile.startWeight); mergedProfile.goalWeight = parseWeightInput(mergedProfile.goalWeight ?? base.profile.goalWeight); mergedProfile.userAvatar = mergedProfile.userAvatar \vert{}\vert{} base.profile.userAvatar; mergedProfile.aiAvatar = mergedProfile.aiAvatar \vert{}\vert{} base.profile.aiAvatar; mergedProfile.geminiApiKey = mergedProfile.geminiApiKey \vert{}\vert{} '';  const merged = { ...base, ...parsed, onboardingCompleted: Boolean(parsed.onboardingCompleted), profile: mergedProfile, habits: Array.isArray(parsed.habits) && parsed.habits.length ? parsed.habits : base.habits, habitCompletions: parsed.habitCompletions && typeof parsed.habitCompletions === 'object' ? parsed.habitCompletions : base.habitCompletions, recurringRules: Array.isArray(parsed.recurringRules) && parsed.recurringRules.length ? parsed.recurringRules : base.recurringRules, recurringCompletions: parsed.recurringCompletions && typeof parsed.recurringCompletions === 'object' ? parsed.recurringCompletions : {}, tasksByDate: parsed.tasksByDate && typeof parsed.tasksByDate === 'object' ? parsed.tasksByDate : base.tasksByDate, events: Array.isArray(parsed.events) ? parsed.events : base.events, caloriesByDate: parsed.caloriesByDate && typeof parsed.caloriesByDate === 'object' ? parsed.caloriesByDate : base.caloriesByDate, sleepByDate: parsed.sleepByDate && typeof parsed.sleepByDate === 'object' ? parsed.sleepByDate : base.sleepByDate, waterByDate: parsed.waterByDate && typeof parsed.waterByDate === 'object' ? parsed.waterByDate : base.waterByDate, weightLogs: Array.isArray(parsed.weightLogs) && parsed.weightLogs.length ? parsed.weightLogs.map(w => ({ ...w, weight: parseWeightInput(w.weight) })) : base.weightLogs, aiMessages: Array.isArray(parsed.aiMessages) && parsed.aiMessages.length ? parsed.aiMessages : base.aiMessages };  memoryFallbackState = merged; writeBackupToWindow(merged); return merged; }  function saveState() { memoryFallbackState = state; writeBackupToWindow(state); try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }  // ========================================================================= // 2. LOGIKA CYKLICZNYCH PRZYPOMNIEŃ, WODY I KALORII // ========================================================================= function getRuleStatusForDate(rule, dateKey) { if (rule.type === 'every_n_days') { const interval = Math.max(1, Number(rule.intervalDays) \vert{}\vert{} 3); const anchor = rule.anchorDate \vert{}\vert{} TODAY_KEY; const diff = daysBetween(anchor, dateKey); const mod = ((diff \% interval) + interval) \% interval; const isDue = mod === 0; const daysUntil = isDue ? 0 : (interval - mod); return { isDue, daysUntil, label: isDue ? 'Dzisiaj wypada!' : (daysUntil === 1 ? 'Za 1 dzień' : `Za ${daysUntil} dni`)
        };
      }
      if (rule.type === 'monthly_day') {
        const targetDay = Math.min(28, Math.max(1, Number(rule.dayOfMonth) || 14));
        const d = parseDateKey(dateKey);
        const curDay = d.getDate();
        const isDue = curDay === targetDay;
        let daysUntil = 0;
        if (!isDue) {
          if (curDay < targetDay) {
            daysUntil = targetDay - curDay;
          } else {

        return {
          isDue,
          daysUntil,
          label: isDue ? `Dzisiaj (${targetDay}. dzień miesiąca)` : `${targetDay}. każdego miesiąca (za ${daysUntil} dni)`
        };
      }
      return { isDue: false, daysUntil: 0, label: '' };
    }

    function isRuleDone(ruleId, dateKey) {
      return Boolean(state.recurringCompletions?.[dateKey]?.[ruleId]);
    }

    function toggleRuleCompletion(ruleId, dateKey) {
      if (!state.recurringCompletions[dateKey]) state.recurringCompletions[dateKey] = {};
      state.recurringCompletions[dateKey][ruleId] = !state.recurringCompletions[dateKey][ruleId];
      saveState();
      render();
    }

    function getWaterTotal(dateKey) {
      const list = state.waterByDate[dateKey] || [];
      return list.reduce((sum, item) => sum + (Number(item.ml) || 0), 0);
    }

    function syncWaterHabit(dateKey) {
      const waterHabit = state.habits.find(h => h.id === 'h_water' || h.title.toLowerCase().includes('woda'));
      if (!waterHabit) return;
      const total = getWaterTotal(dateKey);
      const goal = Number(state.profile.waterGoalMl) || 3000;
      if (!state.habitCompletions[dateKey]) state.habitCompletions[dateKey] = {};
      if (total >= goal) {
        state.habitCompletions[dateKey][waterHabit.id] = true;
      }
    }

    function addWaterEntry(dateKey, ml, source = 'Ręcznie') {
      const amount = Math.round(Number(ml) || 0);
      if (amount <= 0) return;
      if (!state.waterByDate[dateKey]) state.waterByDate[dateKey] = [];
      const now = new Date();
      const timeStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      state.waterByDate[dateKey].push({
        id: 'wtr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        ml: amount,
        time: timeStr,
        source
      });
      syncWaterHabit(dateKey);
      saveState();
    }

        acc.protein += Number(it.protein) || 0;
        return acc;
      }, { kcal: 0, protein: 0 });
    }

    function addMealEntry(dateKey, name, kcal, protein = 0, mealType = 'Posiłek') {
      const cleanName = (name || 'Posiłek').trim();
      const cleanKcal = Math.max(0, Math.round(Number(kcal) || 0));
      const cleanProtein = Math.max(0, Math.round(Number(protein) || 0));
      if (!state.caloriesByDate[dateKey]) state.caloriesByDate[dateKey] = [];
      state.caloriesByDate[dateKey].push({
        id: 'meal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        kcal: cleanKcal,
        protein: cleanProtein,
        mealType
      });
      saveState();
    }

    function addWeightEntry(dateKey, weightVal) {
      const w = parseWeightInput(weightVal);
      if (w <= 0) return;
      state.profile.currentWeight = w;
      if (!state.profile.startWeight || state.profile.startWeight <= 0) {
        state.profile.startWeight = w;
      }
      const existingIdx = state.weightLogs.findIndex(item => item.date === dateKey);
      if (existingIdx >= 0) {
        state.weightLogs[existingIdx].weight = w;
      } else {
        state.weightLogs.push({
          id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          date: dateKey,
          weight: w
        });
      }
      state.weightLogs.sort((a, b) => a.date.localeCompare(b.date));
      saveState();
    }

    function suggestTargets(profile) {
      const weight = parseWeightInput(profile.currentWeight) || 80;
      const height = Number(profile.heightCm) || 178;
      const age = Number(profile.age) || 24;
      const sexOffset = profile.gender === 'female' ? -161 : 5;
      const bmr = 10 * weight + 6.25 * height - 5 * age + sexOffset;
      let tdee = bmr * 1.45;
      if (profile.goalType === 'cut') tdee -= 350;
      if (profile.goalType === 'bulk') tdee += 300;
      const calorieGoal = Math.max(1400, Math.round(tdee / 50) * 50);
      const waterGoalMl = Math.max(2000, Math.round((weight * 35) / 250) * 250);
      return { calorieGoal, waterGoalMl };
    }

    // =========================================================================

    function applyParsedActions(actions) {
      const appliedLabels = [];
      if (!Array.isArray(actions)) return appliedLabels;

      for (const act of actions) {
        if (!act || !act.type) continue;
        const targetDate = act.date && /^\d{4}-\d{2}-\d{2}$/.test(act.date) ? act.date : TODAY_KEY;

        if (act.type === 'water') {
          const ml = Number(act.ml) || 250;
          addWaterEntry(targetDate, ml, 'Asystent AI');
          appliedLabels.push(`+${ml} ml wody (${formatShortDate(targetDate)})`);
        } else if (act.type === 'meal') {
          const name = act.name || 'Posiłek';
          const kcal = Number(act.kcal) || 350;
          const protein = Number(act.protein) || 20;
          addMealEntry(targetDate, name, kcal, protein, act.mealType || 'Posiłek');
          appliedLabels.push(`Posiłek: ${name} (${kcal} kcal, ${protein}g B)`); } else if (act.type === 'sleep') { const hours = Number(act.hours) \vert{}\vert{} 7; const quality = act.quality \vert{}\vert{} 'Dobry'; state.sleepByDate[targetDate] = { hours: Number(hours.toFixed(1)), quality, note: act.note \vert{}\vert{} 'Dodane przez Asystenta AI' }; saveState(); appliedLabels.push(`Sen: ${hours}h (${quality}) na${formatShortDate(targetDate)}`);
        } else if (act.type === 'weight') {
          const w = parseWeightInput(act.weight);
          if (w > 0) {
            addWeightEntry(targetDate, w);
            appliedLabels.push(`Waga: ${formatWeight(w)} (${formatShortDate(targetDate)})`);
          }
        } else if (act.type === 'habit_done') {
          const query = (act.habitName || '').toLowerCase();
          const matched = state.habits.find(h => h.title.toLowerCase().includes(query) || query.includes(h.title.toLowerCase().split(' ')[0]));
          if (matched) {
            if (!state.habitCompletions[targetDate]) state.habitCompletions[targetDate] = {};
            state.habitCompletions[targetDate][matched.id] = true;
            saveState();
            appliedLabels.push(`Zaliczono nawyk: ${matched.title}`);
          } else if (act.habitName) {
            if (!state.tasksByDate[targetDate]) state.tasksByDate[targetDate] = [];
            state.tasksByDate[targetDate].push({ id: 'tsk_' + Date.now() + Math.random(), title: act.habitName, done: true });
            saveState();
            appliedLabels.push(`Zapisano jako wykonane: ${act.habitName}`);
          }
        } else if (act.type === 'add_habit') {
          const title = (act.title || '').trim();
          if (title) {
            state.habits.push({
              id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              title,
              icon: act.icon || '✅'
            });
            saveState();
            appliedLabels.push(`Nowy codzienny nawyk: ${title}`);
          }
        } else if (act.type === 'task') {
          const title = (act.title || '').trim();
          if (title) {
            if (!state.tasksByDate[targetDate]) state.tasksByDate[targetDate] = [];
            state.tasksByDate[targetDate].push({
              id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              title,
              done: false
            });
            saveState();
            appliedLabels.push(`Zadanie na ${formatShortDate(targetDate)}: ${title}`); } } else if (act.type === 'event') { const title = (act.title \vert{}\vert{} 'Wydarzenie').trim(); state.events.push({ id: 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), title, date: targetDate, recurringYearly: Boolean(act.recurringYearly), category: act.category \vert{}\vert{} 'Wydarzenie' }); saveState(); appliedLabels.push(`Kalendarz (${formatShortDate(targetDate)}): ${title}${act.recurringYearly ? ' [co roku]' : ''}`);
        }
      }

      return appliedLabels;
    }

    function parseNaturalLanguageLocal(input) {
      const text = input.trim();
      const lower = text.toLowerCase();
      const actions = [];

      let targetDate = TODAY_KEY;
      if (/\bpojutrze\b/.test(lower)) targetDate = addDays(TODAY_KEY, 2);
      else if (/\bjutro\b/.test(lower)) targetDate = addDays(TODAY_KEY, 1);
      else if (/\bwczoraj\b/.test(lower)) targetDate = addDays(TODAY_KEY, -1);

      const monthsMap = {
        stycznia: '01', styczen: '01',
        lutego: '02', luty: '02',
        marca: '03', marzec: '03',
        kwietnia: '04', kwiecien: '04',
        maja: '05', maj: '05',
        czerwca: '06', czerwiec: '06',
        lipca: '07', lipiec: '07',
        sierpnia: '08', sierpien: '08',
        wrzesnia: '09', wrzesien: '09',
        pazdziernika: '10', 'października': '10', pazdziernik: '10', 'październik': '10',
        listopada: '11', listopad: '11',
        grudnia: '12', grudzien: '12'
      };
      const monthMatch = lower.match(/\b(\d{1,2})\s+(stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|wrzesnia|września|pazdziernika|października|listopada|grudnia)\b/);
      if (monthMatch) {
        const day = pad2(Number(monthMatch[1]));
        const mKey = monthMatch[2].replace('ś', 's').replace('ź', 'z');
        const mon = monthsMap[mKey] || '01';
        const yr = parseDateKey(TODAY_KEY).getFullYear();
        targetDate = `${yr}-${mon}-${day}`;
      }

      // Woda
      const literMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:l|litr|litra|litrów)/);
      const mlMatch = lower.match(/(\d{2,4})\s*ml/);
      if (literMatch) {
        const liters = parseFloat(literMatch[1].replace(',', '.'));
        if (liters > 0 && liters <= 10) actions.push({ type: 'water', ml: Math.round(liters * 1000), date: targetDate });
      } else if (mlMatch) {
        actions.push({ type: 'water', ml: Number(mlMatch[1]), date: targetDate });
      } else if (/pół litra|pol litra/.test(lower)) {
        actions.push({ type: 'water', ml: 500, date: targetDate });
      } else if (/szklank[aęi] wody|wypiłem wod[ęe]|wypilem wode/.test(lower)) {
        actions.push({ type: 'water', ml: 250, date: targetDate });
      }

      // Waga
      const weightMatch = lower.match(/(?:waż[ęe]|waze|waga)\s*(?:dzi[śs]|dzis)?\s*[:=]?\s*(\d{2,3}(?:[.,]\d{1,2})?)\s*(?:kg)?/);
      if (weightMatch) {
        actions.push({ type: 'weight', weight: parseWeightInput(weightMatch[1]), date: targetDate });
      }

      // Sen
      const sleepHoursMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:h|godz|godzin|godziny)\s*(?:snu)?/);
      const sleepWordMatch = lower.match(/(?:spałem|spalem|sen)\s+(\d+(?:[.,]\d+)?)/);
      if (sleepHoursMatch || sleepWordMatch) {
        const rawH = sleepHoursMatch ? sleepHoursMatch[1] : sleepWordMatch[1];
        const hours = parseFloat(rawH.replace(',', '.'));
        let quality = 'Dobry';
        if (/średnio|srednio|tak sobie|słabo|slabo/.test(lower)) quality = 'Średni';
        else if (/świetnie|swietnie|super|extra|mocno/.test(lower)) quality = 'Świetny';
        actions.push({ type: 'sleep', hours, quality, date: targetDate });
      }

      // Posiłek / kalorie
      if (/zjadłem|zjadlem|zjadłam|zjadlam|na śniadanie|na sniadanie|na obiad|na kolację|na kolacje|kcal|kalorii/.test(lower)) {
        const kcalMatch = lower.match(/(\d{2,4})\s*kcal/);
        const protMatch = lower.match(/(\d{1,3})\s*g?\s*(?:białka|bialka|b)/);
        let mealName = text
          .replace(/^(wypiłem|wypilem|i)\s+/i, '')
          .replace(/(zjadłem|zjadlem|zjadłam|zjadlam)\s+/i, '')
          .replace(/\(?\s*\d{2,4}\s*kcal[^)]*\)?/gi, '')
          .trim();
        if (mealName.length > 60) mealName = mealName.slice(0, 60) + '…';
        const estimatedKcal = kcalMatch ? Number(kcalMatch[1]) : 420;
        const estimatedProtein = protMatch ? Number(protMatch[1]) : 22;
        actions.push({
          type: 'meal',
          name: mealName || 'Posiłek',
          kcal: estimatedKcal,
          protein: estimatedProtein,
          date: targetDate
        });
      }

      // Dodanie nowego codziennego nawyku
      const addHabitMatch = text.match(/(?:dodaj\s+(?:codzienny\s+)?nawyk|nowy\s+nawyk)\s+(.+)/i);
      if (addHabitMatch) {
        actions.push({ type: 'add_habit', title: addHabitMatch[1].trim() });
      }

      // Odhaczenie nawyku
      if (/kreatyn[ęe]|kreatyna/.test(lower) && /wzi[aą][łl][eę]m|zaliczon|zrobion|odznacz/.test(lower)) {
        actions.push({ type: 'habit_done', habitName: 'Kreatyna', date: targetDate });
      }
      if (/w[aą]s|wasa/.test(lower) && /zadbane|zrobion|rano|odznacz/.test(lower) && !addHabitMatch) {
        actions.push({ type: 'habit_done', habitName: 'Dbanie o wąsa rano', date: targetDate });
      }
      if (/z[eę]b[yi]|szczotkowan/.test(lower) && /umyt|zrobion|odznacz/.test(lower)) {
        const isEvening = /wieczor|noc/.test(lower);
        actions.push({ type: 'habit_done', habitName: isEvening ? 'Mycie zębów wieczorem' : 'Mycie zębów rano', date: targetDate });
      }

      // Urodziny / wydarzenie w kalendarzu
      if (/urodzin/.test(lower)) {
        const cleanTitle = text.replace(/^(przypomnij\s+mi\s+|dodaj\s+|zapisz\s+)/i, '').trim();
        actions.push({ type: 'event', title: cleanTitle, date: targetDate, recurringYearly: true, category: 'Urodziny' });
      } else {
        const taskMatch = text.match(/(?:dodaj\s+zadanie|zadanie|przypomnij(?:\s+mi)?(?:\s+o)?)\s+(.+)/i);
        if (taskMatch) {
          actions.push({ type: 'task', title: taskMatch[1].trim(), date: targetDate });
        }
      }

      if (!actions.length) {
        actions.push({ type: 'task', title: text, date: targetDate });
      }

      return {
        reply: 'Zapisałem to w Twoim planerze **YouVsYou**!',
        actions
      };
    }
