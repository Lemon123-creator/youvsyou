  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }

  <style>
    :root {
      --bg-base: #090b10;
      --bg-surface: rgba(17, 21, 32, 0.80);
      --bg-surface-solid: #111520;
      --bg-input: rgba(9, 12, 20, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-1: #10b981;
      --accent-2: #6366f1;
      --accent-rgb: 16, 185, 129;
      --accent2-rgb: 99, 102, 241;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .ambient-bg {
      background:
        radial-gradient(circle at 12% 10%, rgba(var(--accent-rgb), 0.10), transparent 36%),
        radial-gradient(circle at 88% 16%, rgba(var(--accent2-rgb), 0.10), transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(var(--accent-rgb), 0.05), transparent 45%),
        var(--bg-base);
    }
    .glass-card {
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.55);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .glass-card-hover:hover {
      border-color: rgba(var(--accent-rgb), 0.35);
      transform: translateY(-1px);
    }
    .accent-gradient {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }
    .accent-bar {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    }
    .accent-text {
      color: var(--accent-1);
    }
    .accent2-text {
      color: var(--accent-2);
    }
    .accent-badge {
      background-color: rgba(var(--accent-rgb), 0.15);
      border: 1px solid rgba(var(--accent-rgb), 0.32);
      color: var(--accent-1);
    }
    .accent-btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      box-shadow: 0 8px 24px -6px rgba(var(--accent-rgb), 0.45);
      transition: filter 0.18s ease, transform 0.14s ease;
    }
    .accent-btn:hover { filter: brightness(1.08); }
    .accent-btn:active { transform: scale(0.98); }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-enter {
      animation: viewFadeIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .slide-step {
      animation: slideInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes prGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 0 22px 2px rgba(245, 158, 11, 0.38); }
    }
    .pr-card-glow {
      animation: prGlow 3s ease-in-out infinite;
    }

    @keyframes waveShift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .wave-anim {
      animation: waveShift 5s linear infinite;
    }

    /* Jasny tryb dzienny */
    body.theme-light {
      --bg-base: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.88);
      --bg-surface-solid: #ffffff;
      --bg-input: #f8fafc;
      --border-subtle: rgba(15, 23, 42, 0.10);
      --text-main: #0f172a;
      --text-muted: #475569;
    }
    body.theme-light .text-white { color: #0f172a !important; }
    body.theme-light .text-slate-100 { color: #1e293b !important; }
    body.theme-light .text-slate-200 { color: #334155 !important; }
    body.theme-light .text-slate-300 { color: #475569 !important; }
    body.theme-light .text-slate-400 { color: #64748b !important; }
    body.theme-light .bg-slate-900,
    body.theme-light .bg-slate-900\/90,
    body.theme-light .bg-slate-950,
    body.theme-light .bg-slate-950\/60 {
      background-color: #f8fafc !important;
    }
    body.theme-light .border-white\/10,
    body.theme-light .border-white\/15 {
      border-color: rgba(15, 23, 42, 0.12) !important;
    }
    body.theme-light .bg-white\/5,
    body.theme-light .bg-white\/\[0\.02\],
    body.theme-light .bg-white\/\[0\.03\] {
      background-color: rgba(15, 23, 42, 0.04) !important;
    }
    body.theme-light .glass-card {
      box-shadow: 0 10px 28px -12px rgba(15, 23, 42, 0.14);
    }

    /* Tryb OLED */
    body.theme-oled {
      --bg-base: #000000;
      --bg-surface: rgba(10, 12, 18, 0.90);
      --bg-surface-solid: #0a0c12;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
  </style>
</head>

    function applyThemeVariables() {
      const accent = getAccentTheme(state.profile.accentTheme);
      const root = document.documentElement;
      root.style.setProperty('--accent-1', accent.c1);
      root.style.setProperty('--accent-2', accent.c2);
      root.style.setProperty('--accent-rgb', accent.rgb1);
      root.style.setProperty('--accent2-rgb', accent.rgb2);

      const bgMode = state.profile.bgMode || 'dark';
      document.body.classList.remove('theme-light', 'theme-oled');
      if (bgMode === 'light') {
        document.body.classList.add('theme-light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        if (bgMode === 'oled') document.body.classList.add('theme-oled');

    // =========================================================================
    // 2. DATY, FORMATOWANIE I DOMYŚLNY STAN
    // =========================================================================
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toDateKey(dateObj) {
      return `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}-${pad2(dateObj.getDate())}`;
    }
    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function addDays(dateKey, delta) {
      const d = parseDateKey(dateKey);
      d.setDate(d.getDate() + delta);
      return toDateKey(d);
    }
    function formatPolishDate(dateKey) {
      const d = parseDateKey(dateKey);
      return d.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function formatShortDate(dateKey) {
      const d = parseDateKey(dateKey);
      return d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
    }
    function daysBetween(startKey, endKey) {
      const a = parseDateKey(startKey);
      const b = parseDateKey(endKey);
      const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
      const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((utcB - utcA) / 86400000);
    }
    function parseWeightInput(val) {
      if (typeof val === 'number') return Number.isFinite(val) ? Number(val.toFixed(2)) : 0;
      const cleaned = String(val).trim().replace(',', '.').replace(/[^0-9.]/g, '');
      const num = parseFloat(cleaned);
      return Number.isFinite(num) ? Number(num.toFixed(2)) : 0;
    }
    function formatWeight(val) {
      return `${parseWeightInput(val).toFixed(2)} kg`;
    }

                name: 'Wiosłowanie sztangą w opadzie',
                sets: [
                  { weight: 70, reps: 10 },
                  { weight: 75, reps: 8 },
                  { weight: 75, reps: 8 }
                ]
              }
            ]
          }
        ],
        aiMessages: [
          {
            role: 'assistant',
            text: 'Cześć! Jestem Twoim asystentem w **YouVsYou**. Możesz wpisać codzienne rzeczy (np. *"wypiłem 500 ml wody i wziąłem kreatynę"*, *"zjadłem kurczaka z ryżem 620 kcal 45g białka 70g węgli 12g tłuszczu"*) albo wrzucić trening po siłowni (np. *"Trening: Wyciskanie na ławce: 85kg x 8, 85kg x 7; Podciąganie: 10kg x 8, 10kg x 8"*).',
            applied: []
          }
        ]
      };
    }

    function readBackupFromWindow() {
      try {
        if (window.name && window.name.startsWith(BACKUP_NAME_KEY)) {
          const raw = window.name.slice(BACKUP_NAME_KEY.length);
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') return parsed;
        }
      } catch (_) {}
      return null;
    }

    function writeBackupToWindow(data) {
      try {
        const serialized = JSON.stringify(data);
        if (serialized.length < 1800000) window.name = BACKUP_NAME_KEY + serialized;
      } catch (_) {}
    }

    let memoryFallbackState = null;

    function loadState() {
      const base = getDefaultData();
      let parsed = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('youvsyou_tracker_v2');
        if (raw) parsed = JSON.parse(raw);
      } catch (_) {}

      const winBackup = readBackupFromWindow();
      if (!parsed && winBackup) parsed = winBackup;
      if (!parsed && memoryFallbackState) parsed = memoryFallbackState;

      if (!parsed || typeof parsed !== 'object') return base;

      const mergedProfile = { ...base.profile, ...(parsed.profile || {}) };
      mergedProfile.startWeight = parseWeightInput(mergedProfile.startWeight ?? base.profile.startWeight);
      mergedProfile.currentWeight = parseWeightInput(mergedProfile.currentWeight ?? mergedProfile.startWeight);
      mergedProfile.goalWeight = parseWeightInput(mergedProfile.goalWeight ?? base.profile.goalWeight);

      const merged = {
        ...base,
        ...parsed,
        onboardingCompleted: Boolean(parsed.onboardingCompleted),
        profile: mergedProfile,
        habits: Array.isArray(parsed.habits) && parsed.habits.length ? parsed.habits : base.habits,
        habitCompletions: parsed.habitCompletions && typeof parsed.habitCompletions === 'object' ? parsed.habitCompletions : base.habitCompletions,
        recurringRules: Array.isArray(parsed.recurringRules) && parsed.recurringRules.length ? parsed.recurringRules : base.recurringRules,
        recurringCompletions: parsed.recurringCompletions && typeof parsed.recurringCompletions === 'object' ? parsed.recurringCompletions : {},
        tasksByDate: parsed.tasksByDate && typeof parsed.tasksByDate === 'object' ? parsed.tasksByDate : base.tasksByDate,
        events: Array.isArray(parsed.events) ? parsed.events : base.events,
        caloriesByDate: parsed.caloriesByDate && typeof parsed.caloriesByDate === 'object' ? parsed.caloriesByDate : base.caloriesByDate,
        sleepByDate: parsed.sleepByDate && typeof parsed.sleepByDate === 'object' ? parsed.sleepByDate : base.sleepByDate,
        waterByDate: parsed.waterByDate && typeof parsed.waterByDate === 'object' ? parsed.waterByDate : base.waterByDate,
        weightLogs: Array.isArray(parsed.weightLogs) && parsed.weightLogs.length
          ? parsed.weightLogs.map(w => ({ ...w, weight: parseWeightInput(w.weight) }))
          : base.weightLogs,
        workouts: Array.isArray(parsed.workouts) ? parsed.workouts : base.workouts,
        aiMessages: Array.isArray(parsed.aiMessages) && parsed.aiMessages.length ? parsed.aiMessages : base.aiMessages
      };

      memoryFallbackState = merged;
      writeBackupToWindow(merged);
      return merged;
    }

    function saveState() {
      memoryFallbackState = state;
      writeBackupToWindow(state);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    // =========================================================================
    // 3. LOGIKA CYKLI, DNI TRENINGOWYCH, KALKULATORÓW I ANALIZY SIŁOWNI
    // =========================================================================
    function getRuleStatusForDate(rule, dateKey) {
      if (rule.type === 'every_n_days') {
        const interval = Math.max(1, Number(rule.intervalDays) || 3);
        const anchor = rule.anchorDate || TODAY_KEY;
        const diff = daysBetween(anchor, dateKey);
        const mod = ((diff % interval) + interval) % interval;
        const isDue = mod === 0;
        const daysUntil = isDue ? 0 : (interval - mod);
        return {
          isDue,
          daysUntil,
          label: isDue ? 'Dzisiaj wypada!' : (daysUntil === 1 ? 'Za 1 dzień' : `Za ${daysUntil} dni`)
        };
      }
      if (rule.type === 'monthly_day') {
        const targetDay = Math.min(28, Math.max(1, Number(rule.dayOfMonth) || 14));
        const d = parseDateKey(dateKey);
        const curDay = d.getDate();
        const isDue = curDay === targetDay;
        let daysUntil = 0;
        if (!isDue) {
          if (curDay < targetDay) {
            daysUntil = targetDay - curDay;
          } else {
            const nextMonth = new Date(d.getFullYear(), d.getMonth() + 1, targetDay);
            daysUntil = daysBetween(dateKey, toDateKey(nextMonth));
          }
        }
        return {
          isDue,
          daysUntil,
          label: isDue ? `Dzisiaj (${targetDay}. dzień miesiąca)` : `${targetDay}. dnia miesiąca (za ${daysUntil} dni)`
        };
      }
      return { isDue: false, daysUntil: 0, label: '' };
    }

    function isTrainingDay(dateKey) {
      const hasLoggedWorkout = (state.workouts || []).some(w => w.date === dateKey);
      if (hasLoggedWorkout) return true;
      const gymRule = (state.recurringRules || []).find(r => r.isGymRule || r.title.toLowerCase().includes('siłown'));
      if (gymRule && getRuleStatusForDate(gymRule, dateKey).isDue) return true;
      return false;
    }

    function getEffectiveWaterGoal(dateKey) {
      const base = Number(state.profile.waterGoalMl) || 3000;
      const bonus = Number(state.profile.trainingWaterBonusMl) || 500;
      return isTrainingDay(dateKey) ? base + bonus : base;
    }

    function isRuleDone(ruleId, dateKey) {
      return Boolean(state.recurringCompletions?.[dateKey]?.[ruleId]);
    }

    function toggleRuleCompletion(ruleId, dateKey) {
      if (!state.recurringCompletions[dateKey]) state.recurringCompletions[dateKey] = {};
      state.recurringCompletions[dateKey][ruleId] = !state.recurringCompletions[dateKey][ruleId];
      saveState();
      render();
    }

    function getWaterTotal(dateKey) {
      const list = state.waterByDate[dateKey] || [];
      return list.reduce((sum, item) => sum + (Number(item.ml) || 0), 0);
    }

    function syncWaterHabit(dateKey) {
      const waterHabit = state.habits.find(h => h.id === 'h_water' || h.title.toLowerCase().includes('woda'));
      if (!waterHabit) return;
      const total = getWaterTotal(dateKey);
      const goal = getEffectiveWaterGoal(dateKey);
      if (!state.habitCompletions[dateKey]) state.habitCompletions[dateKey] = {};
      if (total >= goal) state.habitCompletions[dateKey][waterHabit.id] = true;
    }

    function addWaterEntry(dateKey, ml, source = 'Ręcznie') {
      const amount = Math.round(Number(ml) || 0);
      if (amount <= 0) return;
      if (!state.waterByDate[dateKey]) state.waterByDate[dateKey] = [];
      const now = new Date();
      const timeStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      state.waterByDate[dateKey].push({
        id: 'wtr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        ml: amount,
        time: timeStr,
        source
      });
      syncWaterHabit(dateKey);
      saveState();
    }

    function getCaloriesSummary(dateKey) {
      const items = state.caloriesByDate[dateKey] || [];
      return items.reduce((acc, it) => {
        acc.kcal += Number(it.kcal) || 0;
        acc.protein += Number(it.protein) || 0;
        acc.carbs += Number(it.carbs) || 0;
        acc.fat += Number(it.fat) || 0;
        return acc;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function addMealEntry(dateKey, name, kcal, protein = 0, carbs = 0, fat = 0, mealType = 'Posiłek') {
      const cleanName = (name || 'Posiłek').trim();
      const cleanKcal = Math.max(0, Math.round(Number(kcal) || 0));
      const cleanProtein = Math.max(0, Math.round(Number(protein) || 0));
      const cleanCarbs = Math.max(0, Math.round(Number(carbs) || 0));
      const cleanFat = Math.max(0, Math.round(Number(fat) || 0));
      if (!state.caloriesByDate[dateKey]) state.caloriesByDate[dateKey] = [];
      state.caloriesByDate[dateKey].push({
        id: 'meal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        kcal: cleanKcal,
        protein: cleanProtein,
        carbs: cleanCarbs,
        fat: cleanFat,
        mealType
      });
      saveState();
    }

    function addWeightEntry(dateKey, weightVal) {
      const w = parseWeightInput(weightVal);
      if (w <= 0) return;
      state.profile.currentWeight = w;
      if (!state.profile.startWeight || state.profile.startWeight <= 0) state.profile.startWeight = w;
      const existingIdx = state.weightLogs.findIndex(item => item.date === dateKey);
      if (existingIdx >= 0) state.weightLogs[existingIdx].weight = w;
      else {
        state.weightLogs.push({
          id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          date: dateKey,
          weight: w
        });
      }
      state.weightLogs.sort((a, b) => a.date.localeCompare(b.date));
      saveState();
    }

    function calculateNutritionTargets(profile) {
      const weight = parseWeightInput(profile.currentWeight) || 80;
      const height = Number(profile.heightCm) || 180;
      const age = Number(profile.age) || 22;
      const sexOffset = profile.gender === 'female' ? -161 : 5;
      const bmr = Math.round(10 * weight + 6.25 * height - 5 * age + sexOffset);
      let tdee = Math.round(bmr * 1.50);
      let calorieGoal = tdee;
      if (profile.goalType === 'cut') calorieGoal = tdee - 350;
      if (profile.goalType === 'bulk') calorieGoal = tdee + 300;
      calorieGoal = Math.max(1400, Math.round(calorieGoal / 25) * 25);

      const proteinMult = profile.goalType === 'cut' ? 2.1 : 1.9;
      const proteinGoal = Math.round(weight * proteinMult);
      const fatGoal = Math.round(weight * 0.85);
      const remainingKcal = Math.max(200, calorieGoal - (proteinGoal * 4 + fatGoal * 9));
      const carbsGoal = Math.round(remainingKcal / 4);
      const waterGoalMl = Math.max(2000, Math.round((weight * 35) / 250) * 250);

      return { bmr, tdee, calorieGoal, proteinGoal, carbsGoal, fatGoal, waterGoalMl };
    }

    // --- Analiza treningów, 1RM (wzór Epley), Rekordy PR i Plan na kolejną sesję ---
    function estimate1RM(weight, reps) {
      const w = Number(weight) || 0;
      const r = Number(reps) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Number(w.toFixed(1));
      return Number((w * (1 + r / 30)).toFixed(1));
    }

    function normalizeExerciseKey(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function getExerciseAnalytics() {
      const sortedWorkouts = [...(state.workouts || [])].sort((a, b) => a.date.localeCompare(b.date));
      const map = new Map();

      for (const wo of sortedWorkouts) {
        for (const ex of (wo.exercises || [])) {
          const key = normalizeExerciseKey(ex.name);
          if (!key) continue;
          if (!map.has(key)) {
            map.set(key, {
              name: ex.name.trim(),
              sessions: [],
              bestWeight: 0,
              bestWeightReps: 0,
              bestWeightDate: '',
              best1RM: 0,
              best1RMDate: '',
              prevBest1RM: 0,
              isRecentPR: false
            });
          }
          const entry = map.get(key);
          let sessionMaxW = 0;
          let sessionMaxWReps = 0;
          let sessionBest1RM = 0;
          let sessionTonnage = 0;

          for (const s of (ex.sets || [])) {
            const w = Number(s.weight) || 0;
            const r = Number(s.reps) || 0;
            sessionTonnage += w * r;
            const e1rm = estimate1RM(w, r);
            if (e1rm > sessionBest1RM) sessionBest1RM = e1rm;
            if (w > sessionMaxW || (w === sessionMaxW && r > sessionMaxWReps)) {
              sessionMaxW = w;
              sessionMaxWReps = r;
            }
          }

          if (sessionBest1RM > entry.best1RM) {
            entry.prevBest1RM = entry.best1RM;
            entry.best1RM = sessionBest1RM;
            entry.best1RMDate = wo.date;
          }
          if (sessionMaxW > entry.bestWeight || (sessionMaxW === entry.bestWeight && sessionMaxWReps > entry.bestWeightReps)) {
            entry.bestWeight = sessionMaxW;
            entry.bestWeightReps = sessionMaxWReps;
            entry.bestWeightDate = wo.date;
          }

          entry.sessions.push({
            date: wo.date,
            sets: ex.sets || [],
            maxWeight: sessionMaxW,
            maxWeightReps: sessionMaxWReps,
            best1RM: sessionBest1RM,
            tonnage: Math.round(sessionTonnage)
          });
        }
      }

      const lastSleep = state.sleepByDate[TODAY_KEY] || state.sleepByDate[addDays(TODAY_KEY, -1)];
      const lowRecovery = lastSleep && (Number(lastSleep.hours) < 6.2 || Number(lastSleep.energy) <= 2);

      for (const entry of map.values()) {
        const last = entry.sessions[entry.sessions.length - 1];
        const prev = entry.sessions.length >= 2 ? entry.sessions[entry.sessions.length - 2] : null;
        entry.isRecentPR = entry.best1RMDate && daysBetween(entry.best1RMDate, TODAY_KEY) <= 4;

        if (!last || !last.sets.length) {
          entry.nextPlan = 'Wykonaj 3 serie robocze z zapasem 2 powtórzeń.';
          continue;
        }

        const topSet = last.sets.reduce((best, cur) => (Number(cur.weight) >= Number(best.weight) ? cur : best), last.sets[0]);
        const minRepsInWorking = Math.min(...last.sets.map(s => Number(s.reps) || 0));
        const maxRepsInWorking = Math.max(...last.sets.map(s => Number(s.reps) || 0));
        const stepKg = Number(topSet.weight) >= 40 ? 2.5 : 1.25;

        if (lowRecovery) {
          entry.nextPlan = `Uwaga na regenerację (słabszy sen/energia): utrzymaj ${topSet.weight} kg × ${minRepsInWorking}–${maxRepsInWorking} powt. bez dokładania ciężaru.`;
        } else if (minRepsInWorking >= 8) {
          const nextW = Number((Number(topSet.weight) + stepKg).toFixed(2));
          entry.nextPlan = `Progresja ciężaru: wejdź na ${nextW} kg i celuj w 3 × 6–8 powt.`;
        } else if (prev && last.best1RM < prev.best1RM) {
          entry.nextPlan = `Utrzymaj ${topSet.weight} kg i domknij równe ${maxRepsInWorking} powt. w każdej serii przed dołożeniem krążków.`;
        } else {
          const targetReps = Math.min(10, maxRepsInWorking + 1);
          entry.nextPlan = `Podwójna progresja: zostaw ${topSet.weight} kg i postaraj się dobić do ${targetReps} powt. w seriach.`;
        }
      }

      return Array.from(map.values());
    }

    function parseWorkoutText(rawText) {
      const lines = String(rawText || '').split(/\n|;/).map(l => l.trim()).filter(Boolean);
      const exercises = [];

      for (const line of lines) {
        const cleanLine = line.replace(/^(trening|siłownia|silownia)\s*[:\-]\s*/i, '').trim();
        if (!cleanLine) continue;

        let exName = '';
        let setsPart = '';
        if (cleanLine.includes(':')) {
          const idx = cleanLine.indexOf(':');
          exName = cleanLine.slice(0, idx).trim();
          setsPart = cleanLine.slice(idx + 1).trim();
        } else {
          const m = cleanLine.match(/^([^\d]+?)\s+(\d+(?:[.,]\d+)?\s*(?:kg)?\s*[x×*]\s*\d+.*)$/i);
          if (m) {
            exName = m[1].trim();
            setsPart = m[2].trim();
          }
        }

        if (!exName || !setsPart) continue;
        const sets = [];
        const tripleMatch = setsPart.match(/^(\d+)\s*[x×*]\s*(\d+)\s*(?:na|@)?\s*(\d+(?:[.,]\d+)?)\s*(?:kg)?$/i);
        if (tripleMatch) {
          const count = Math.min(10, Math.max(1, Number(tripleMatch[1])));
          const reps = Number(tripleMatch[2]);
          const weight = parseFloat(tripleMatch[3].replace(',', '.'));
          for (let i = 0; i < count; i++) sets.push({ weight, reps });
        } else {
          const regex = /(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[x×*]\s*(\d+)/gi;
          let match;
          while ((match = regex.exec(setsPart)) !== null) {
            sets.push({
              weight: parseFloat(match[1].replace(',', '.')),
              reps: Number(match[2])
            });
          }
        }

        if (sets.length) {
          exercises.push({ name: exName, sets });
        }
      }

      return exercises;
    }

    function getWeeklyComparison() {
      let curKcalSum = 0, curKcalDays = 0;
      let prevKcalSum = 0, prevKcalDays = 0;
      let curSleepSum = 0, curSleepDays = 0;
      let prevSleepSum = 0, prevSleepDays = 0;
      let curHabitDone = 0, curHabitTotal = 0;
      let prevHabitDone = 0, prevHabitTotal = 0;

      const habitsCount = state.habits.length || 1;

      for (let i = 0; i < 7; i++) {
        const kCur = addDays(TODAY_KEY, -i);
        const kPrev = addDays(TODAY_KEY, -(i + 7));

        const cCur = getCaloriesSummary(kCur).kcal;
        if (cCur > 0) { curKcalSum += cCur; curKcalDays++; }
        const cPrev = getCaloriesSummary(kPrev).kcal;
        if (cPrev > 0) { prevKcalSum += cPrev; prevKcalDays++; }

        const sCur = Number(state.sleepByDate[kCur]?.hours) || 0;
        if (sCur > 0) { curSleepSum += sCur; curSleepDays++; }
        const sPrev = Number(state.sleepByDate[kPrev]?.hours) || 0;
        if (sPrev > 0) { prevSleepSum += sPrev; prevSleepDays++; }

        const hCurMap = state.habitCompletions[kCur] || {};
        curHabitDone += state.habits.filter(h => hCurMap[h.id]).length;
        curHabitTotal += habitsCount;

        const hPrevMap = state.habitCompletions[kPrev] || {};
        prevHabitDone += state.habits.filter(h => hPrevMap[h.id]).length;
        prevHabitTotal += habitsCount;
      }

      const curTonnage = (state.workouts || [])
        .filter(w => daysBetween(w.date, TODAY_KEY) >= 0 && daysBetween(w.date, TODAY_KEY) < 7)
        .reduce((sum, w) => sum + (w.exercises || []).reduce((s2, ex) => s2 + (ex.sets || []).reduce((s3, st) => s3 + (Number(st.weight) || 0) * (Number(st.reps) || 0), 0), 0), 0);

      const prevTonnage = (state.workouts || [])
        .filter(w => daysBetween(w.date, TODAY_KEY) >= 7 && daysBetween(w.date, TODAY_KEY) < 14)
        .reduce((sum, w) => sum + (w.exercises || []).reduce((s2, ex) => s2 + (ex.sets || []).reduce((s3, st) => s3 + (Number(st.weight) || 0) * (Number(st.reps) || 0), 0), 0), 0);

      return {
        avgKcalCur: curKcalDays ? Math.round(curKcalSum / curKcalDays) : 0,
        avgKcalPrev: prevKcalDays ? Math.round(prevKcalSum / prevKcalDays) : 0,
        avgSleepCur: curSleepDays ? Number((curSleepSum / curSleepDays).toFixed(1)) : 0,
        avgSleepPrev: prevSleepDays ? Number((prevSleepSum / prevSleepDays).toFixed(1)) : 0,
        habitPctCur: Math.round((curHabitDone / Math.max(1, curHabitTotal)) * 100),
        habitPctPrev: Math.round((prevHabitDone / Math.max(1, prevHabitTotal)) * 100),
        tonnageCur: Math.round(curTonnage),
        tonnagePrev: Math.round(prevTonnage)
      };
    }

    function getUpcomingRadarItems() {
      const items = [];
      for (const rule of (state.recurringRules || [])) {
        const st = getRuleStatusForDate(rule, TODAY_KEY);
        items.push({
          title: rule.title,
          icon: rule.icon || '🔁',
          daysUntil: st.daysUntil,
          badge: st.daysUntil === 0 ? 'Dzisiaj!' : (st.daysUntil === 1 ? 'Jutro' : `Za ${st.daysUntil} dni`)
        });
      }
      for (const ev of (state.events || [])) {
        let nextDate = ev.date;
        if (ev.recurringYearly) {
          const curYear = parseDateKey(TODAY_KEY).getFullYear();
          const candidate = `${curYear}-${ev.date.slice(5)}`;
          nextDate = candidate >= TODAY_KEY ? candidate : `${curYear + 1}-${ev.date.slice(5)}`;
        }
        const diff = daysBetween(TODAY_KEY, nextDate);
        if (diff >= 0 && diff <= 45) {
          items.push({
            title: ev.title,
            icon: '🎂',
            daysUntil: diff,
            badge: diff === 0 ? 'Dzisiaj!' : (diff === 1 ? 'Jutro' : `Za ${diff} dni`)
          });
        }
      }
      return items.sort((a, b) => a.daysUntil - b.daysUntil).slice(0, 4);
    }

    // =========================================================================
    // 4. ASYSTENT AI (GEMINI API + PARSER LOKALNY Z MAKRO I TRENINGAMI)
    // =========================================================================
    function applyParsedActions(actions) {
      const appliedLabels = [];
      if (!Array.isArray(actions)) return appliedLabels;

      for (const act of actions) {
        if (!act || !act.type) continue;
        const targetDate = act.date && /^\d{4}-\d{2}-\d{2}$/.test(act.date) ? act.date : TODAY_KEY;

        if (act.type === 'water') {
          const ml = Number(act.ml) || 250;
          addWaterEntry(targetDate, ml, 'Asystent AI');
          appliedLabels.push(`+${ml} ml wody (${formatShortDate(targetDate)})`);
        } else if (act.type === 'meal') {
          const name = act.name || 'Posiłek';
          const kcal = Number(act.kcal) || 350;
          const protein = Number(act.protein) || 20;
          const carbs = Number(act.carbs) || 35;
          const fat = Number(act.fat) || 10;
          addMealEntry(targetDate, name, kcal, protein, carbs, fat, act.mealType || 'Posiłek');
          appliedLabels.push(`Posiłek: ${name} (${kcal} kcal • B:${protein}g W:${carbs}g T:${fat}g)`);
        } else if (act.type === 'sleep') {
          const hours = Number(act.hours) || 7;
          const quality = act.quality || 'Dobry';
          const energy = Math.min(5, Math.max(1, Number(act.energy) || 4));
          state.sleepByDate[targetDate] = {
            hours: Number(hours.toFixed(1)),
            quality,
            energy,
            note: act.note || 'Dodane przez Asystenta AI'
          };
          saveState();
          appliedLabels.push(`Sen: ${hours}h (${quality}, energia ${energy}/5)`);
        } else if (act.type === 'weight') {
          const w = parseWeightInput(act.weight);
          if (w > 0) {
            addWeightEntry(targetDate, w);
            appliedLabels.push(`Waga: ${formatWeight(w)} (${formatShortDate(targetDate)})`);
          }
        } else if (act.type === 'workout') {
          const exercises = Array.isArray(act.exercises) ? act.exercises : [];
          if (exercises.length) {
            state.workouts.push({
              id: 'wo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              date: targetDate,
              title: act.title || 'Trening siłowy',
              notes: act.notes || 'Zapisane przez Asystenta AI',
              exercises
            });
            saveState();
            appliedLabels.push(`Trening (${formatShortDate(targetDate)}): ${exercises.map(e => e.name).join(', ')}`);
          }
        } else if (act.type === 'habit_done') {
          const query = (act.habitName || '').toLowerCase();
          const matched = state.habits.find(h => h.title.toLowerCase().includes(query) || query.includes(h.title.toLowerCase().split(' ')[0]));
          if (matched) {
            if (!state.habitCompletions[targetDate]) state.habitCompletions[targetDate] = {};
            state.habitCompletions[targetDate][matched.id] = true;
            saveState();
            appliedLabels.push(`Zaliczono nawyk: ${matched.title}`);
          } else if (act.habitName) {
            if (!state.tasksByDate[targetDate]) state.tasksByDate[targetDate] = [];
            state.tasksByDate[targetDate].push({ id: 'tsk_' + Date.now() + Math.random(), title: act.habitName, done: true });
            saveState();
            appliedLabels.push(`Zapisano jako wykonane: ${act.habitName}`);
          }
        } else if (act.type === 'add_habit') {
          const title = (act.title || '').trim();
          if (title) {
            state.habits.push({
              id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              title,
              icon: act.icon || '✅',
              timeOfDay: act.timeOfDay || 'all'
            });
            saveState();
            appliedLabels.push(`Nowy codzienny nawyk: ${title}`);
          }
        } else if (act.type === 'task') {
          const title = (act.title || '').trim();
          if (title) {
            if (!state.tasksByDate[targetDate]) state.tasksByDate[targetDate] = [];
            state.tasksByDate[targetDate].push({
              id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
              title,
              done: false
            });
            saveState();
            appliedLabels.push(`Zadanie na ${formatShortDate(targetDate)}: ${title}`);
          }
        } else if (act.type === 'event') {
          const title = (act.title || 'Wydarzenie').trim();
          state.events.push({
            id: 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            title,
            date: targetDate,
            recurringYearly: Boolean(act.recurringYearly),
            category: act.category || 'Wydarzenie'
          });
          saveState();
          appliedLabels.push(`Kalendarz (${formatShortDate(targetDate)}): ${title}${act.recurringYearly ? ' [co roku]' : ''}`);
        }
      }

      return appliedLabels;
    }

    function parseNaturalLanguageLocal(input) {
      const text = input.trim();
      const lower = text.toLowerCase();
      const actions = [];

      let targetDate = TODAY_KEY;
      if (/\bpojutrze\b/.test(lower)) targetDate = addDays(TODAY_KEY, 2);
      else if (/\bjutro\b/.test(lower)) targetDate = addDays(TODAY_KEY, 1);
      else if (/\bwczoraj\b/.test(lower)) targetDate = addDays(TODAY_KEY, -1);

      const parsedExercises = parseWorkoutText(text);
      if (parsedExercises.length) {
        actions.push({
          type: 'workout',
          title: 'Trening siłowy',
          date: targetDate,
          exercises: parsedExercises
        });
        return {
          reply: 'Zapisałem trening i przeliczyłem Twoje rekordy oraz podpowiedź na kolejną sesję w zakładce **Siłownia & Progres**!',
          actions
        };
      }

      const literMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:l|litr|litra|litrów)/);
      const mlMatch = lower.match(/(\d{2,4})\s*ml/);
      if (literMatch) {
        const liters = parseFloat(literMatch[1].replace(',', '.'));
        if (liters > 0 && liters <= 10) actions.push({ type: 'water', ml: Math.round(liters * 1000), date: targetDate });
      } else if (mlMatch) {
        actions.push({ type: 'water', ml: Number(mlMatch[1]), date: targetDate });
      } else if (/pół litra|pol litra/.test(lower)) {
        actions.push({ type: 'water', ml: 500, date: targetDate });
      } else if (/szklank[aęi] wody|wypiłem wod[ęe]|wypilem wode/.test(lower)) {
        actions.push({ type: 'water', ml: 250, date: targetDate });
      }

      const weightMatch = lower.match(/(?:waż[ęe]|waze|waga)\s*(?:dzi[śs]|dzis)?\s*[:=]?\s*(\d{2,3}(?:[.,]\d{1,2})?)\s*(?:kg)?/);
      if (weightMatch) {
        actions.push({ type: 'weight', weight: parseWeightInput(weightMatch[1]), date: targetDate });
      }

      const sleepHoursMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:h|godz|godzin|godziny)\s*(?:snu)?/);
      const sleepWordMatch = lower.match(/(?:spałem|spalem|sen)\s+(\d+(?:[.,]\d+)?)/);
      if (sleepHoursMatch || sleepWordMatch) {
        const rawH = sleepHoursMatch ? sleepHoursMatch[1] : sleepWordMatch[1];
        const hours = parseFloat(rawH.replace(',', '.'));
        let quality = 'Dobry';
        let energy = 4;
        if (/średnio|srednio|tak sobie|słabo|slabo/.test(lower)) { quality = 'Średni'; energy = 2; }
        else if (/świetnie|swietnie|super|extra|mocno/.test(lower)) { quality = 'Świetny'; energy = 5; }
        const enMatch = lower.match(/energi[aai]\s*(\d)\s*(?:\/\s*5)?/);
        if (enMatch) energy = Math.min(5, Math.max(1, Number(enMatch[1])));
        actions.push({ type: 'sleep', hours, quality, energy, date: targetDate });
      }

      if (/zjadłem|zjadlem|zjadłam|zjadlam|na śniadanie|na sniadanie|na obiad|na kolację|na kolacje|kcal|kalorii/.test(lower)) {
        const kcalMatch = lower.match(/(\d{2,4})\s*kcal/);
        const protMatch = lower.match(/(\d{1,3})\s*g?\s*(?:białka|bialka|b\b)/);
        const carbMatch = lower.match(/(\d{1,3})\s*g?\s*(?:węgli|wegli|węglowodanów|weglowodanow|w\b)/);
        const fatMatch = lower.match(/(\d{1,3})\s*g?\s*(?:tłuszczu|tluszczu|t\b)/);
        let mealName = text
          .replace(/^(wypiłem|wypilem|i)\s+/i, '')
          .replace(/(zjadłem|zjadlem|zjadłam|zjadlam)\s+/i, '')
          .replace(/\d{2,4}\s*kcal/gi, '')
          .replace(/\d{1,3}\s*g?\s*(?:białka|bialka|węgli|wegli|węglowodanów|weglowodanow|tłuszczu|tluszczu)/gi, '')
          .trim();
        if (mealName.length > 55) mealName = mealName.slice(0, 55) + '…';
        actions.push({
          type: 'meal',
          name: mealName || 'Posiłek',
          kcal: kcalMatch ? Number(kcalMatch[1]) : 450,
          protein: protMatch ? Number(protMatch[1]) : 25,
          carbs: carbMatch ? Number(carbMatch[1]) : 45,
          fat: fatMatch ? Number(fatMatch[1]) : 12,
          date: targetDate
        });
      }

      const addHabitMatch = text.match(/(?:dodaj\s+(?:codzienny\s+)?nawyk|nowy\s+nawyk)\s+(.+)/i);
      if (addHabitMatch) {
        actions.push({ type: 'add_habit', title: addHabitMatch[1].trim() });
      }

      if (/kreatyn[ęe]|kreatyna/.test(lower) && /wzi[aą][łl][eę]m|zaliczon|zrobion|odznacz/.test(lower)) {
        actions.push({ type: 'habit_done', habitName: 'Kreatyna', date: targetDate });
      }
      if (/w[aą]s|wasa/.test(lower) && /zadbane|zrobion|rano|odznacz/.test(lower) && !addHabitMatch) {
        actions.push({ type: 'habit_done', habitName: 'Dbanie o wąsa rano', date: targetDate });
      }
      if (/z[eę]b[yi]|szczotkowan/.test(lower) && /umyt|zrobion|odznacz/.test(lower)) {
        const isEvening = /wieczor|noc/.test(lower);
        actions.push({ type: 'habit_done', habitName: isEvening ? 'Mycie zębów wieczorem' : 'Mycie zębów rano', date: targetDate });
      }

      if (/urodzin/.test(lower)) {
        const cleanTitle = text.replace(/^(przypomnij\s+mi\s+|dodaj\s+|zapisz\s+)/i, '').trim();
        actions.push({ type: 'event', title: cleanTitle, date: targetDate, recurringYearly: true, category: 'Urodziny' });
      } else {
        const taskMatch = text.match(/(?:dodaj\s+zadanie|zadanie|przypomnij(?:\s+mi)?(?:\s+o)?)\s+(.+)/i);
        if (taskMatch) actions.push({ type: 'task', title: taskMatch[1].trim(), date: targetDate });
      }

      if (!actions.length) {
        actions.push({ type: 'task', title: text, date: targetDate });
      }

      return {
        reply: 'Zapisałem to w Twoim planerze **YouVsYou**!',
        actions
      };
    }

    async function sendAiPrompt(rawPrompt) {
      const prompt = (rawPrompt || '').trim();
      if (!prompt || ui.aiLoading) return;

      state.aiMessages.push({ role: 'user', text: prompt, applied: [] });
      ui.aiDraft = '';
      ui.aiLoading = true;
      saveState();
      render();

      const apiKey = (state.profile.geminiApiKey || '').trim();
      let replyText = '';
      let applied = [];

      if (apiKey) {
        try {
          const systemInstruction = `Jesteś asystentem aplikacji YouVsYou dla "${state.profile.name}". Dzisiaj: ${TODAY_KEY}.
Zwróć WYŁĄCZNIE poprawny JSON:
{
  "reply": "krótka odpowiedź po polsku",
  "actions": [
    {"type":"water","ml":500,"date":"YYYY-MM-DD"}
  ]
}`;
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: systemInstruction + '\n\nWiadomość: ' + prompt }] }],
              generationConfig: { temperature: 0.2 }
            })
          });
          const data = await resp.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            applied = applyParsedActions(parsed.actions || []);
            replyText = parsed.reply || 'Zaktualizowałem Twoje dane!';
          } else throw new Error('Brak JSON');
        } catch (_) {
          const fallback = parseNaturalLanguageLocal(prompt);
          applied = applyParsedActions(fallback.actions);
          replyText = fallback.reply;
        }
      } else {
        const localRes = parseNaturalLanguageLocal(prompt);
        applied = applyParsedActions(localRes.actions);
        replyText = localRes.reply;
      }

      state.aiMessages.push({ role: 'assistant', text: replyText, applied });
      ui.aiLoading = false;
      saveState();
      render();
    }

        fatGoal: calc.fatGoal,
        waterGoalMl: Math.max(500, Number(p.waterGoalMl) || calc.waterGoalMl)

          </div>
        </div>
      `;

      document.getElementById('btn-prev-slide')?.addEventListener('click', () => { syncInput(); if (step > 0) { ui.onboardingStep = step - 1; render(); } });
      document.getElementById('btn-next-slide')?.addEventListener('click', () => { syncInput(); nextStep(); });
      document.getElementById('btn-skip-onboarding')?.addEventListener('click', () => { syncInput(); finishOnboarding(); });
      document.querySelectorAll('[data-pick-gender]').forEach(btn => btn.addEventListener('click', () => { p.gender = btn.getAttribute('data-pick-gender'); ui.onboardingStep = step + 1; render(); }));
      document.querySelectorAll('[data-pick-goal]').forEach(btn => btn.addEventListener('click', () => {
        p.goalType = btn.getAttribute('data-pick-goal');
        const s = calculateNutritionTargets({ ...p, currentWeight: p.startWeight });
        p.calorieGoal = s.calorieGoal;
        p.waterGoalMl = s.waterGoalMl;
        ui.onboardingStep = step + 1;
        render();
      }));
      document.getElementById('slide-focus-input')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); syncInput(); nextStep(); } });
    }

                  const dayNum = Number(key.slice(-2));

                  const isSelected = key === ui.selectedDate;

    function renderWeightTab() {
      const startW = parseWeightInput(state.profile.startWeight);
      const currentW = parseWeightInput(state.profile.currentWeight);
      const goalW = parseWeightInput(state.profile.goalWeight);
      const heightM = (Number(state.profile.heightCm) || 180) / 100;
      const bmi = (currentW / (heightM * heightM)).toFixed(1);

      const diffFromStart = Number((currentW - startW).toFixed(2));
      const totalSpan = Math.abs(goalW - startW);
      const doneSpan = Math.abs(currentW - startW);
      const progressPct = totalSpan > 0.01 ? Math.max(0, Math.min(100, Math.round((doneSpan / totalSpan) * 100))) : 100;

      const logs = state.weightLogs || [];
      let chartSvg = `<div class="text-xs text-slate-500 py-8 text-center">Dodaj więcej pomiarów, aby zobaczyć wykres trendu.</div>`;
      if (logs.length >= 2) {
        const vals = logs.map(l => parseWeightInput(l.weight));
        const minV = Math.min(...vals, goalW) - 0.5;
        const maxV = Math.max(...vals, goalW) + 0.5;
        const w = 520;
        const h = 180;
        const pts = logs.map((l, idx) => {
          const x = 32 + (idx / (logs.length - 1)) * (w - 52);
          const normY = (parseWeightInput(l.weight) - minV) / Math.max(0.1, maxV - minV);
          const y = h - 26 - normY * (h - 48);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const goalNorm = (goalW - minV) / Math.max(0.1, maxV - minV);
        const goalY = Math.max(14, Math.min(h - 24, h - 26 - goalNorm * (h - 48)));

        chartSvg = `
          <svg viewBox="0 0 ${w} ${h}" class="w-full h-48 overflow-visible">
            <line x1="32" y1="${goalY.toFixed(1)}" x2="${w - 20}" y2="${goalY.toFixed(1)}" stroke="var(--accent-2)" stroke-width="1.5" stroke-dasharray="5 5" />
            <text x="${w - 22}" y="${(goalY - 5).toFixed(1)}" text-anchor="end" fill="#a5b4fc" font-size="11">Cel: ${formatWeight(goalW)}</text>
            <polyline fill="none" stroke="var(--accent-1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts.join(' ')}" />
            ${logs.map((l, idx) => {
              const [cx, cy] = pts[idx].split(',');
              return `<circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--accent-1)" stroke="#090b10" stroke-width="2" /><text x="${cx}" y="${h - 6}" text-anchor="middle" fill="#94a3b8" font-size="10">${formatShortDate(l.date)}</text>`;
            }).join('')}
          </svg>
        `;
      }

      return `
        <div class="view-enter space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

    // =========================================================================
    // 8. GŁÓWNY RENDER I OBSŁUGA ZDARZEŃ
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }
    function formatSimpleMarkdown(str) {
      return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong class="text-white font-bold">$1</strong>');
    }

    }

    function bindEvents() {
      document.querySelectorAll('[data-nav-tab]').forEach(btn => btn.addEventListener('click', () => { ui.activeTab = btn.getAttribute('data-nav-tab'); render(); }));
      document.querySelectorAll('[data-jump-tab]').forEach(btn => btn.addEventListener('click', () => { ui.activeTab = btn.getAttribute('data-jump-tab'); render(); }));
      document.querySelectorAll('[data-day-nav]').forEach(btn => btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-day-nav');
        ui.selectedDate = val === 'today' ? TODAY_KEY : addDays(ui.selectedDate, Number(val));
        render();
      }));

      document.getElementById('btn-open-evening-modal')?.addEventListener('click', () => { ui.showEveningModal = true; render(); });
      document.getElementById('btn-close-evening-modal')?.addEventListener('click', () => { ui.showEveningModal = false; render(); });
      document.querySelectorAll('[data-evening-done-habit]').forEach(btn => btn.addEventListener('click', () => {
        const hid = btn.getAttribute('data-evening-done-habit');
        if (!state.habitCompletions[TODAY_KEY]) state.habitCompletions[TODAY_KEY] = {};
        state.habitCompletions[TODAY_KEY][hid] = true;
        saveState();
        render();
      }));
      document.getElementById('btn-evening-drink')?.addEventListener('click', () => { addWaterEntry(TODAY_KEY, 250, 'Podgląd wieczorny'); render(); });
      document.getElementById('btn-evening-save-sleep')?.addEventListener('click', () => {
        const h = Number(document.getElementById('ev-sleep-h')?.value) || 7.5;
        const e = Number(document.getElementById('ev-sleep-e')?.value) || 4;
        state.sleepByDate[TODAY_KEY] = { hours: Number(h.toFixed(1)), quality: e >= 4 ? 'Dobry' : 'Średni', energy: e };
        saveState();
        render();
      });

      document.getElementById('btn-toggle-habit-editor')?.addEventListener('click', () => { ui.showHabitEditor = !ui.showHabitEditor; render(); });
      document.getElementById('btn-add-habit')?.addEventListener('click', () => {
        const title = (document.getElementById('new-habit-title')?.value || '').trim();
        if (!title) return;
        state.habits.push({
          id: 'h_' + Date.now(),
          title,
          icon: (document.getElementById('new-habit-icon')?.value || '✅').trim() || '✅',
          timeOfDay: document.getElementById('new-habit-tod')?.value || 'all'
        });
        saveState();
        render();
      });
      document.querySelectorAll('[data-toggle-habit]').forEach(btn => btn.addEventListener('click', () => {
        const hid = btn.getAttribute('data-toggle-habit');
        const dKey = ui.selectedDate;
        if (!state.habitCompletions[dKey]) state.habitCompletions[dKey] = {};
        state.habitCompletions[dKey][hid] = !state.habitCompletions[dKey][hid];
        saveState();
        render();
      }));
      document.querySelectorAll('[data-edit-habit]').forEach(btn => btn.addEventListener('click', () => {
        const h = state.habits.find(x => x.id === btn.getAttribute('data-edit-habit'));
        if (!h) return;
        const updated = prompt('Nowa nazwa nawyku:', h.title);
        if (updated && updated.trim()) { h.title = updated.trim(); saveState(); render(); }
      }));
      document.querySelectorAll('[data-del-habit]').forEach(btn => btn.addEventListener('click', () => {
        state.habits = state.habits.filter(x => x.id !== btn.getAttribute('data-del-habit'));
        saveState();
        render();
      }));

      const addTaskNow = () => {
        const title = (document.getElementById('new-task-input')?.value || '').trim();
        if (!title) return;
        if (!state.tasksByDate[ui.selectedDate]) state.tasksByDate[ui.selectedDate] = [];
        state.tasksByDate[ui.selectedDate].push({ id: 'tsk_' + Date.now(), title, done: false });
        saveState();
        render();
      };
      document.getElementById('btn-add-task')?.addEventListener('click', addTaskNow);
      document.getElementById('new-task-input')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTaskNow(); } });
      document.querySelectorAll('[data-toggle-task]').forEach(btn => btn.addEventListener('click', () => {
        const found = (state.tasksByDate[ui.selectedDate] || []).find(t => t.id === btn.getAttribute('data-toggle-task'));
        if (found) { found.done = !found.done; saveState(); render(); }
      }));
      document.querySelectorAll('[data-del-task]').forEach(btn => btn.addEventListener('click', () => {
        state.tasksByDate[ui.selectedDate] = (state.tasksByDate[ui.selectedDate] || []).filter(t => t.id !== btn.getAttribute('data-del-task'));
        saveState();
        render();
      }));

      document.querySelectorAll('[data-toggle-rule]').forEach(btn => btn.addEventListener('click', () => toggleRuleCompletion(btn.getAttribute('data-toggle-rule'), ui.selectedDate)));
      document.querySelectorAll('[data-del-rule]').forEach(btn => btn.addEventListener('click', () => {
        state.recurringRules = state.recurringRules.filter(r => r.id !== btn.getAttribute('data-del-rule'));
        saveState();
        render();
      }));
      document.getElementById('btn-open-rule-modal')?.addEventListener('click', () => { ui.showRuleModal = true; render(); });
      document.getElementById('btn-close-rule-modal')?.addEventListener('click', () => { ui.showRuleModal = false; render(); });
      document.getElementById('rule-type')?.addEventListener('change', e => {
        const isMonthly = e.target.value === 'monthly_day';
        document.getElementById('rule-interval-wrap')?.classList.toggle('hidden', isMonthly);
        document.getElementById('rule-day-wrap')?.classList.toggle('hidden', !isMonthly);
      });
      document.getElementById('btn-save-rule')?.addEventListener('click', () => {
        const title = (document.getElementById('rule-title')?.value || '').trim();
        if (!title) return;
        state.recurringRules.push({
          id: 'rule_' + Date.now(),
          title,
          icon: (document.getElementById('rule-icon')?.value || '🔁').trim() || '🔁',
          type: document.getElementById('rule-type')?.value || 'every_n_days',
          intervalDays: Math.max(1, Number(document.getElementById('rule-interval')?.value) || 3),
          dayOfMonth: Math.min(28, Math.max(1, Number(document.getElementById('rule-day')?.value) || 14)),
          anchorDate: ui.selectedDate
        });
        ui.showRuleModal = false;
        saveState();
        render();
      });

      document.getElementById('btn-save-workout')?.addEventListener('click', () => {
        const raw = document.getElementById('wo-raw-text')?.value || '';
        const title = (document.getElementById('wo-title')?.value || 'Trening Siłowy').trim();
        const date = document.getElementById('wo-date')?.value || TODAY_KEY;
        const exercises = parseWorkoutText(raw);
        if (!exercises.length) {
          alert('Wpisz chociaż jedno ćwiczenie w formacie np. "Wyciskanie na ławce: 85kg x 8, 85kg x 7".');
          return;
        }
        state.workouts.push({
          id: 'wo_' + Date.now(),
          date,
          title,
          exercises
        });
        saveState();
        render();
      });
      document.querySelectorAll('[data-del-workout]').forEach(btn => btn.addEventListener('click', () => {
        state.workouts = state.workouts.filter(w => w.id !== btn.getAttribute('data-del-workout'));
        saveState();
        render();
      }));

      document.getElementById('cal-prev-month')?.addEventListener('click', () => { ui.calMonthOffset -= 1; render(); });
      document.getElementById('cal-next-month')?.addEventListener('click', () => { ui.calMonthOffset += 1; render(); });
      document.getElementById('cal-reset-month')?.addEventListener('click', () => { ui.calMonthOffset = 0; ui.selectedDate = TODAY_KEY; render(); });
      document.querySelectorAll('[data-cal-select]').forEach(btn => btn.addEventListener('click', () => { ui.selectedDate = btn.getAttribute('data-cal-select'); render(); }));
      document.getElementById('btn-add-event')?.addEventListener('click', () => {
        const title = (document.getElementById('ev-title')?.value || '').trim();
        const date = document.getElementById('ev-date')?.value || ui.selectedDate;
        if (!title || !date) return;
        state.events.push({ id: 'evt_' + Date.now(), title, date, recurringYearly: Boolean(document.getElementById('ev-yearly')?.checked) });
        saveState();
        render();
      });
      document.querySelectorAll('[data-del-event]').forEach(btn => btn.addEventListener('click', () => {
        state.events = state.events.filter(e => e.id !== btn.getAttribute('data-del-event'));
        saveState();
        render();
      }));

      document.getElementById('btn-apply-calc-targets')?.addEventListener('click', () => {
        const calc = calculateNutritionTargets(state.profile);
        state.profile.calorieGoal = calc.calorieGoal;
        state.profile.proteinGoal = calc.proteinGoal;
        state.profile.carbsGoal = calc.carbsGoal;
        state.profile.fatGoal = calc.fatGoal;
        state.profile.waterGoalMl = calc.waterGoalMl;
        saveState();
        render();
      });
      document.getElementById('btn-add-meal')?.addEventListener('click', () => {
        const name = (document.getElementById('meal-name')?.value || '').trim() || 'Posiłek';
        const kcal = Number(document.getElementById('meal-kcal')?.value) || 0;
        const protein = Number(document.getElementById('meal-protein')?.value) || 0;
        const carbs = Number(document.getElementById('meal-carbs')?.value) || 0;
        const fat = Number(document.getElementById('meal-fat')?.value) || 0;
        if (kcal <= 0 && protein <= 0 && carbs <= 0 && fat <= 0) return;
        addMealEntry(ui.selectedDate, name, kcal, protein, carbs, fat);
        render();
      });
      document.querySelectorAll('[data-del-meal]').forEach(btn => btn.addEventListener('click', () => {
        state.caloriesByDate[ui.selectedDate] = (state.caloriesByDate[ui.selectedDate] || []).filter(m => m.id !== btn.getAttribute('data-del-meal'));
        saveState();
        render();
      }));

      document.getElementById('btn-save-sleep')?.addEventListener('click', () => {
        const hours = Number(document.getElementById('sleep-hours')?.value) || 0;
        const quality = document.getElementById('sleep-quality')?.value || 'Dobry';
        const energy = Number(document.getElementById('sleep-energy')?.value) || 4;
        state.sleepByDate[TODAY_KEY] = { hours: Number(hours.toFixed(1)), quality, energy };
        saveState();
        render();
      });

      document.querySelectorAll('[data-add-water]').forEach(btn => btn.addEventListener('click', () => {
        addWaterEntry(TODAY_KEY, Number(btn.getAttribute('data-add-water')), 'Szybki przycisk');
        render();
      }));

      document.getElementById('btn-save-weight')?.addEventListener('click', () => {
        const parsed = parseWeightInput(document.getElementById('weight-input-val')?.value);
        const dKey = document.getElementById('weight-input-date')?.value || TODAY_KEY;
        if (parsed > 0) { addWeightEntry(dKey, parsed); render(); }
      });

      const openAvModal = () => { ui.showAvatarModal = true; render(); };
      document.getElementById('btn-open-avatar-modal')?.addEventListener('click', openAvModal);
      document.getElementById('btn-open-avatar-modal-gear')?.addEventListener('click', openAvModal);
      document.getElementById('btn-close-avatar-modal')?.addEventListener('click', () => { ui.showAvatarModal = false; render(); });

      document.querySelectorAll('[data-pick-accent]').forEach(btn => btn.addEventListener('click', () => {
        state.profile.accentTheme = btn.getAttribute('data-pick-accent');
        saveState();
        render();
      }));
      document.querySelectorAll('[data-pick-bg]').forEach(btn => btn.addEventListener('click', () => {
        state.profile.bgMode = btn.getAttribute('data-pick-bg');
        saveState();
        render();
      }));
      document.querySelectorAll('[data-pick-user-avatar]').forEach(btn => btn.addEventListener('click', () => {
        state.profile.userAvatar = btn.getAttribute('data-pick-user-avatar');
        saveState();
        render();
      }));
      document.querySelectorAll('[data-pick-ai-avatar]').forEach(btn => btn.addEventListener('click', () => {
        state.profile.aiAvatar = btn.getAttribute('data-pick-ai-avatar');
        saveState();
        render();
      }));
      document.getElementById('btn-save-profile-extras')?.addEventListener('click', () => {
        const keyInput = document.getElementById('input-gemini-key');
        if (keyInput) state.profile.geminiApiKey = keyInput.value.trim();
        ui.showAvatarModal = false;
        saveState();
        render();
      });
      document.getElementById('btn-reopen-quiz')?.addEventListener('click', () => { ui.showAvatarModal = false; openOnboarding(); });

      const openAi = () => { ui.aiOpen = true; render(); };
      document.getElementById('btn-open-ai-side')?.addEventListener('click', openAi);
      document.getElementById('btn-open-ai-top')?.addEventListener('click', openAi);
      document.getElementById('btn-close-ai')?.addEventListener('click', () => { ui.aiOpen = false; render(); });
      document.getElementById('btn-send-ai')?.addEventListener('click', () => sendAiPrompt(document.getElementById('ai-prompt-input')?.value || ''));
      document.getElementById('ai-prompt-input')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendAiPrompt(e.target.value); } });
      document.querySelectorAll('[data-ai-quick]').forEach(btn => btn.addEventListener('click', () => sendAiPrompt(btn.getAttribute('data-ai-quick'))));

      document.getElementById('btn-export-json')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `YouVsYou-kopia-${TODAY_KEY}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
      document.getElementById('btn-import-json-trigger')?.addEventListener('click', () => document.getElementById('input-import-json')?.click());
      document.getElementById('input-import-json')?.addEventListener('change', e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            if (parsed && typeof parsed === 'object') {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
              state = loadState();
              render();
            }
          } catch (_) {}
        };
        reader.readAsText(file);
      });
    }

    render();
  </script>
</body>
</html>
